<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
"use strict";
/* =====================================================================
   SOOBEH — Sistem Jadual Syif & Gaji (Fasa 1, PRD v1.0)
   KITARAN TEMPOHAN 2 MINGGU: Tempoh 1 (1–15) & Tempoh 2 (16–akhir)
   + Manager assign staff ke slot kosong & tarikh lampau (kecemasan)
   ===================================================================== */

/* ---------- 1. UTILITI ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad2(n){return String(n).padStart(2,'0')}
function rm(n){return 'RM '+(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rm2(n){return 'RM '+(n||0).toFixed(2)}
const HARI=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const BLN=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const DOW=['Isn','Sel','Rab','Kha','Jum','Sab','Aha'];
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function todayStr(){return ymd(new Date())}
function monthKey(ds){return ds.slice(0,7)}
function daysInMonth(mk){const p=mk.split('-');return new Date(+p[0],+p[1],0).getDate()}
function isWeekend(ds){const w=new Date(ds+'T00:00:00').getDay();return w===0||w===6}
function shiftMonth(mk,delta){const p=mk.split('-');return ymd(new Date(+p[0],+p[1]-1+delta,1)).slice(0,7)}
function fmtDateDS(ds){const d=new Date(ds+'T00:00:00');return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()}
function dShort(ds){const d=new Date(ds+'T00:00:00');return d.getDate()+' '+BLN[d.getMonth()].slice(0,3)+' '+d.getFullYear()}
function monthLabel(mk){const p=mk.split('-');return BLN[+p[1]-1]+' '+p[0]}
function ago(t){const s=Math.floor((Date.now()-t)/1000);if(s<60)return 'baru sebentar';if(s<3600)return Math.floor(s/60)+' minit lalu';if(s<86400)return Math.floor(s/3600)+' jam lalu';return Math.floor(s/86400)+' hari lalu'}
function nextDay(ds){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+1);return ymd(d)}

/* ---------- TEMPOH 2 MINGGU (kitaran baharu) ---------- */
function periodOf(ds){return ds.slice(0,7)+((+ds.slice(8,10))<=15?'-A':'-B')}
function periodBounds(pk){const mk=pk.slice(0,7);return pk.endsWith('A')?[mk+'-01',mk+'-15']:[mk+'-16',mk+'-'+pad2(daysInMonth(mk))]}
function periodLabel(pk){const b=periodBounds(pk);return 'Tempoh '+(pk.endsWith('A')?'1':'2')+' · '+dShort(b[0])+' – '+dShort(b[1])}
function curPeriod(){return periodOf(todayStr())}
function nextPeriod(pk){const mk=pk.slice(0,7);return pk.endsWith('A')?mk+'-B':shiftMonth(mk,1)+'-A'}
function prevPeriod(pk){const mk=pk.slice(0,7);return pk.endsWith('B')?mk+'-A':shiftMonth(mk,-1)+'-B'}
function shiftPeriod(pk,d){let p=pk;for(let i=0;i<Math.abs(d);i++)p=d>0?nextPeriod(p):prevPeriod(p);return p}
function bookingWindowEnd(){return periodBounds(nextPeriod(curPeriod()))[1]}

/* ---------- 2. SAMBUNGAN SUPABASE ---------- */
let SB=null, ME=null;
const DEF_SET={baseRate:8,highRate:9,weekdayThreshold:300,weekendThreshold:400,monthlySalesThreshold:3000,perfBonus:100,attBonus:30,typhoidAllowance:10,typhoidMax:5,maxPerShift:2,shiftHours:6,allowStaffSales:false,typhoidEnabled:true};
function emptyDB(){return {users:[],bookings:[],schedule:[],swaps:[],sales:[],payslips:[],notifications:[],audit:[],published:{},settings:Object.assign({},DEF_SET),slotMonths:{}}}
let DB=emptyDB();

/* ---------- 3. PENGURUSAN DATA ---------- */
const mapProfile=r=>({id:r.id,username:r.username,name:r.name,phone:r.phone||'—',role:r.role,payCycle:r.pay_cycle,typhoidCount:r.typhoid_count,active:r.active});
function usernameOf(id){if(!id)return null;const u=DB.users.find(x=>x.id===id);return u?u.username:null}
const mapBooking=(r)=>({id:r.id,staffId:r.staff_id,date:r.date,shift:r.shift,status:r.status,t:Date.parse(r.created_at),by:usernameOf(r.decided_by)});
const mapSchedule=(r)=>({id:r.id,monthKey:r.date.slice(0,7),date:r.date,shift:r.shift,staffId:r.staff_id,noShow:r.no_show});

/* ---------- 5. LOGIK PERNIAGAAN (PRD Seksyen 6 — dinilai SETIAP SYIF) ---------- */
function getSale(date,shift){const s=DB.sales.find(x=>x.date===date&&x.shift===shift);return s?s.amount:null}
function shiftRate(ds,shift,sale){const S=DB.settings;const th=isWeekend(ds)?S.weekendThreshold:S.weekdayThreshold;return (sale!=null&&sale>th)?S.highRate:S.baseRate}
function periodPublished(pk){return !!DB.published[pk]}
function scheduledEntries(staffId,mk){ /* gabung: jadual (termasuk ASSIGN manager) + tempahan disahkan */
  let out=[];
  [mk+'-A',mk+'-B'].forEach(pk=>{
    const b=periodBounds(pk);
    const inR=x=>x.date>=b[0]&&x.date<=b[1];
    if(DB.published[pk]){
      out=out.concat(DB.schedule.filter(x=>inR(x)&&x.staffId===staffId));
    }else{
      const key=e=>e.date+'|'+e.shift;
      const sc=DB.schedule.filter(x=>inR(x)&&x.staffId===staffId); /* tugasan terus manager (termasuk tarikh lampau) */
      const seen=new Set(sc.map(key));
      const bk=DB.bookings.filter(x=>inR(x)&&x.staffId===staffId&&x.status==='approved'&&!seen.has(key(x))).map(x=>({date:x.date,shift:x.shift,noShow:false}));
      out=out.concat(sc).concat(bk);
    }
  });
  return out;
}
function computeCycle(staffId,pStart,pEnd){
  const S=DB.settings,mk=monthKey(pStart);
  const entries=scheduledEntries(staffId,mk).filter(e=>!e.noShow&&e.date>=pStart&&e.date<=pEnd);
  const shifts=[];let totalHours=0,basePay=0,highHours=0,extraPay=0,salesSum=0;
  entries.forEach(e=>{
    const sale=getSale(e.date,e.shift),rate=shiftRate(e.date,e.shift,sale),hours=S.shiftHours,amount=hours*rate;
    totalHours+=hours;basePay+=hours*S.baseRate;
    if(rate>S.baseRate){highHours+=hours;extraPay+=hours*(S.highRate-S.baseRate)}
    if(sale!=null)salesSum+=sale;
    shifts.push({date:e.date,shift:e.shift,hours:hours,sale:sale,rate:rate,amount:amount});
  });
  shifts.sort((a,b)=>a.date.localeCompare(b.date));
  return {shifts:shifts,totalHours:totalHours,basePay:basePay,highHours:highHours,extraPay:extraPay,salesSum:salesSum};
}
function perfEligible(staffId,mk){
  const sum=scheduledEntries(staffId,mk).filter(e=>!e.noShow).reduce((a,e)=>a+(getSale(e.date,e.shift)||0),0);
  return {ok:sum>DB.settings.monthlySalesThreshold,sum:sum};
}
function attEligible(staffId,mk){
  const sched=scheduledEntries(staffId,mk);
  if(!sched.length)return {ok:false,why:'Tiada syif dijadualkan bulan ini'};
  if(sched.some(e=>e.noShow))return {ok:false,why:'Terdapat rekod tidak hadir'};
  const inv=DB.swaps.filter(s=>{const e=DB.schedule.find(x=>x.id===s.entryId);return e&&monthKey(e.date)===mk&&(s.fromStaffId===staffId||s.toStaffId===staffId)});
  if(inv.length)return {ok:false,why:'Terdapat rekod pertukaran syif'};
  return {ok:true,why:''};
}
function estimateFor(staffId){
  const S=DB.settings,mk=monthKey(todayStr());
  const c=computeCycle(staffId,mk+'-01',todayStr());
  const perf=perfEligible(staffId,mk),att=attEligible(staffId,mk);
  const st=DB.users.find(u=>u.id===staffId)||{};
  const typh=(S.typhoidEnabled!==false&&st.typhoidCount<S.typhoidMax)?S.typhoidAllowance:0;
  return {c:c,perf:perf,att:att,typh:typh,total:c.basePay+c.extraPay+(perf.ok?S.perfBonus:0)+(att.ok?S.attBonus:0)+typh};
}

async function generatePayslip(staffId,pStart,pEnd){
  const staff=DB.users.find(u=>u.id===staffId);
  if(!staff||staff.role!=='staff')return {ok:false,msg:'Staff tidak sah'};
  if(DB.payslips.some(p=>p.staffId===staffId&&p.start===pStart))return {ok:false,msg:staff.name+' — slip tempoh ini sudah dijana'};
  const S=DB.settings,mk=monthKey(pStart);
  const c=computeCycle(staffId,pStart,pEnd);
  const perf=perfEligible(staffId,mk),att=attEligible(staffId,mk);
  const secondHalf=pStart.slice(8,10)==='15';
  const includeBonus=staff.payCycle==='monthly'?true:secondHalf;
  const typhCountBefore=staff.typhoidCount;
  const typh=(S.typhoidEnabled!==false&&typhCountBefore<S.typhoidMax)?S.typhoidAllowance:0;
  if(typh)staff.typhoidCount++;
  const perfAmt=(includeBonus&&perf.ok)?S.perfBonus:0;
  const attAmt=(includeBonus&&att.ok)?S.attBonus:0;
  const total=c.basePay+c.extraPay+perfAmt+attAmt+typh;
  const slip={staffName:staff.name,username:staff.username,cycle:staff.payCycle,start:pStart,end:pEnd,
    shiftCount:c.shifts.length,hours:c.totalHours,basePay:c.basePay,highHours:c.highHours,extraPay:c.extraPay,
    salesSum:c.salesSum,perfSum:perf.sum,perfAmt:perfAmt,attAmt:attAmt,attWhy:att.ok?'':att.why,includeBonus:includeBonus,
    typh:typh,typhNo:typh?typhCountBefore+1:null,typhCountBefore:typhCountBefore,typhOff:S.typhoidEnabled===false,total:total,shifts:c.shifts,
    t:Date.now(),by:ME.username};
  const {error}=await SB.from('payslips').insert({staff_id:staffId,start:pStart,end:pEnd,cycle:staff.payCycle,payload:slip,created_by:ME.id});
  if(error){if(typh)staff.typhoidCount--;if(/duplicate/i.test(error.message||''))return {ok:false,msg:staff.name+' — slip tempoh ini sudah dijana'};return {ok:false,msg:friendly(error)}}
  if(typh){try{await SB.from('profiles').update({typhoid_count:staff.typhoidCount}).eq('id',staffId)}catch(e){}}
  await notifyUsers([staffId],'🧾 Slip gaji anda untuk '+dShort(pStart)+' – '+dShort(pEnd)+' telah dijana ('+rm(total)+'). Semak tab "Slip Gaji".');
  await logAudit('payslip_gen',staff.username+' · '+dShort(pStart)+'–'+dShort(pEnd)+' · '+rm(total));
  return {ok:true};
}
async function genPayslips(kind){
  const u=reqMgr();if(!u)return;
  const mk=ROUTE.pmk,dim=daysInMonth(mk);let start,end,cyc;
  if(kind==='M'){start=mk+'-01';end=mk+'-'+pad2(dim);cyc='monthly'}
  else if(kind==='B1'){start=mk+'-01';end=mk+'-14';cyc='biweekly'}
  else{start=mk+'-15';end=mk+'-'+pad2(dim);cyc='biweekly'}
  const list=DB.users.filter(x=>x.role==='staff'&&x.active!==false&&x.payCycle===cyc);
  if(!list.length)return toast('Tiada staff dalam kumpulan ini','err');
  let ok=0,skip=0;
  for(const x of list){const r=await generatePayslip(x.id,start,end);r.ok?ok++:skip++}
  await logAudit('payslip_group','Kitaran '+cyc+' '+monthLabel(mk)+' — '+ok+' slip');
  await sync();render();
  toast('Jana slip '+dShort(start)+' – '+dShort(end)+': '+ok+' berjaya'+(skip?', '+skip+' dilangkau (sudah wujud)':'')+' ✔','ok');
}

/* ---------- 7. MODUL TEMPAHAN SYIF (kitaran 2 minggu — PRD 5.2/5.3) ---------- */
async function submitBooking(ds,shift){
  if(!ME||ME.role!=='staff')return {ok:false,msg:'Akses ditolak'};
  if(periodPublished(periodOf(ds)))return {ok:false,msg:'Jadual tempoh ini telah dikunci — guna Pertukaran Syif'};
  if(ds<=todayStr())return {ok:false,msg:'Tarikh lampau — tempahan tertutup'};
  const winEnd=bookingWindowEnd();
  if(ds>winEnd)return {ok:false,msg:'Tempahan dibenarkan untuk tempoh semasa & tempoh seterusnya sahaja (kitaran 2 minggu)'};
  if(DB.bookings.some(b=>b.staffId===ME.id&&b.date===ds&&b.shift===shift&&(b.status==='pending'||b.status==='approved')))return {ok:false,msg:'Anda sudah menempah slot ini'};
  if(DB.schedule.some(e=>e.staffId===ME.id&&e.date===ds&&e.shift===shift))return {ok:false,msg:'Anda telah ditugaskan pada slot ini oleh manager'};
  const n=slotCount(ds,shift);

let pinBuf='',failCount=0,lockUntil=0;
function renderDots(){const w=$('#pinDots');if(!w)return;
  w.innerHTML=Array.from({length:6},(_,i)=>'<span class="dot'+(i<pinBuf.length?' on':'')+'"></span>').join('');}
function keyPress(k){if(pinBuf.length>=6)return;pinBuf+=k;renderDots()}
function keyBack(){pinBuf=pinBuf.slice(0,-1);renderDots()}
function clearPin(){pinBuf='';renderDots()}
document.addEventListener('keydown',e=>{
  if(ROUTE.view!=='login')return;
  if(e.target&&e.target.tagName==='INPUT'){
    if(e.key==='Enter'&&e.target.id==='loginUser'){doLogin()}
    return;
  }
  if(/^[0-9]$/.test(e.key)){keyPress(e.key);e.preventDefault()}
  else if(e.key==='Backspace'){keyBack();e.preventDefault()}
  else if(e.key==='Enter'){doLogin()}
});
function mapAuthErr(e,left){
  const m=(e&&e.message)||'';
  if(/Invalid login credentials/i.test(m))return 'ID atau PIN salah. ('+left+' percubaan lagi)';
  if(/rate|security purposes|too many/i.test(m))return '🔒 Terlalu banyak percubaan — tunggu sebentar (perlindungan Supabase Auth).';
  if(/not confirmed/i.test(m))return 'Akaun belum disahkan — semak ✓ Auto Confirm di Dashboard.';
  if(/Database error/i.test(m))return 'Ralat database — jalankan 05_upgrade_2week.sql di Supabase SQL Editor.';
  return m||'Log masuk gagal';
}
async function doLogin(){
  const username=($('#loginUser').value||'').trim().toLowerCase(),pin=pinBuf,err=$('#loginErr');
  const showErr=m=>{err.textContent=m;err.style.display='block';err.classList.add('shake');setTimeout(()=>err.classList.remove('shake'),450)};
  if(!username||pin.length<4)return showErr('Sila masukkan ID dan PIN (4–6 digit).');
  if(Date.now()<lockUntil)return showErr('🔒 Cuba lagi dalam '+Math.ceil((lockUntil-Date.now())/1000)+' saat.');
  const portal=ROUTE.portal==='staff'?'staff':'manager';
  const {data,error}=await SB.auth.signInWithPassword({email:username+'@soobeh.app',password:pin+'-soobeh'});
  if(error){
    failCount++;
    if(failCount>=5){lockUntil=Date.now()+60000;failCount=0;showErr('🔒 Terlalu banyak percubaan gagal — terkunci 60 saat.')}
    else showErr(mapAuthErr(error,5-failCount));
    pinBuf='';renderDots();return;
  }
  failCount=0;
  const {data:prof}=await SB.from('profiles').select('*').eq('id',data.user.id).single();
  if(!prof||prof.active===false){await SB.auth.signOut();return showErr('Profil tidak aktif atau tidak dijumpai. Hubungi manager.');}
  if(portal==='staff'&&prof.role!=='staff'){await SB.auth.signOut();return showErr('Akaun ini perlu log masuk melalui Portal Manager.');}
  if(portal==='manager'&&prof.role==='staff'){await SB.auth.signOut();return showErr('Akaun ini perlu log masuk melalui Portal Staff.');}
  ME=mapProfile(prof);
  ROUTE=Object.assign(freshROUTE(),{view:prof.role==='staff'?'staff':'manager',portal:portal,pk:curPeriod()});
  await loadAll();
  await logAudit('login',ME.username+' log masuk ('+ME.role+')');
  pinBuf='';
  render();toast('Selamat datang, '+ME.name.split(' ')[0]+'! 👋','ok');
}

function slotPill(ds,shift,pub,locked){
  const ic=shift==='morning'?'☀':'🌙';let cls='free',mark='';
  if(locked){cls='none'}
  else if(pub){
    const es=DB.schedule.filter(e=>e.date===ds&&e.shift===shift);
    const mine=es.some(e=>e.staffId===ME.id);
    mark=(mine?'✔':'')+(es.length||'');
    cls=mine?'ok':(es.length?'taken':'none');
  }else{
    const mine=DB.bookings.find(b=>b.date===ds&&b.shift===shift&&b.staffId===ME.id);
    const n=slotCount(ds,shift);
    mark=(mine?(mine.status==='rejected'?'✕':'✔'):'')+(n||'');
    cls=mine?(mine.status==='approved'?'ok':mine.status==='pending'?'wait':'no'):(n?'taken':'free');
  }
  return '<button class="slot st-'+cls+'" onclick="openSlot(\''+ds+'\',\''+shift+'\')"><span>'+ic+'</span><b>'+(mark||'·')+'</b></button>';
}

function openSlot(ds,shift){

    if(mine&&!past)body+='<button class="btn btn-primary btn-big" onclick="closeModal();openSwapModal(\''+mine.id+'\')">🔄 Mohon Tukar Syif Ini</button>';
  }else if(ds<=todayStr()){

  }else if(ds>winEnd){
    body+='<div class="notice warn">🔒 Tempoh ini <b>belum dibuka</b> untuk tempahan. Tempahan dibenarkan untuk tempoh semasa &amp; tempoh seterusnya sahaja (hingga '+dShort(winEnd)+').</div>';
  }else{
    const n=slotCount(ds,shift);
    const mine=DB.bookings.find(b=>b.date===ds&&b.shift===shift&&b.staffId===u.id);
    body+='<div class="detailrow"><span>Tempahan slot ini (termasuk anda)</span><b>'+n+' daripada maks '+DB.settings.maxPerShift+'</b></div>';

        :'<div class="notice warn">Tempoh ini <b>belum dikeluarkan</b>. Anda boleh (a) sahkan tempahan &amp; keluarkan jadual di tab Tempahan, ATAU (b) assign staff terus ke slot di bawah.</div>';
  if(DB.payslips.some(p=>p.monthKey===pk.slice(0,7)))

      let block='<div class="shiftblock"><div class="shifttitle">'+(sh==='morning'?'☀ Syif Pagi':'🌙 Syif Petang')+
      ' <span class="chip '+(es.length>=S.maxPerShift?'chip-ok':'chip-warn')+'">'+es.length+'/'+S.maxPerShift+' staff</span>'+
      (es.length===0?' <span class="chip chip-warn">Tiada staff — perlu diisi!</span>':'')+
      ' '+(sale!=null?'<span class="chip '+(rate>S.baseRate?'chip-ok':'chip-info')+'">Jualan '+rm2(sale)+' · RM'+rate.toFixed(0)+'/jam</span>':'<span class="chip chip-wait">Jualan belum dimasukkan</span>')+'</div>';
      es.forEach(e=>{
        const st=DB.users.find(u=>u.id===e.staffId);

      block+='</div>';

/* ---------- 18. BOOT (dengan paparan ralat) ---------- */
window.addEventListener('error',e=>showFatal(e.message));
window.addEventListener('unhandledrejection',e=>showFatal((e.reason&&e.reason.message)||String(e.reason)));
function showFatal(msg){
  const r=document.getElementById('app');
  if(r&&!r.innerHTML.trim()){
    r.innerHTML='<div class="landing"><div class="hero glass"><div class="logo big">⚠️</div><h1>Ralat Memuatkan Sistem</h1>'+
    '<p style="opacity:.9">'+esc(msg)+'</p>'+
    '<p class="hint">Semak <b>config.js</b>, pastikan sudah di-commit ke GitHub &amp; Vercel telah re-deploy. Buka <b>/check.html</b> untuk diagnostik penuh.</p></div></div>';
  }
}
async function boot(){
  try{
    if(!window.supabase){ROUTE.view='setup';render();return}
    if(!CONFIG||!CONFIG.SUPABASE_URL||!CONFIG.SUPABASE_ANON_KEY||/GANTI|XXXX/i.test(String(CONFIG.SUPABASE_URL)+String(CONFIG.SUPABASE_ANON_KEY))){ROUTE.view='setup';render();return}
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(String(CONFIG.SUPABASE_URL).trim())){showFatal('SUPABASE_URL tidak sah: "'+esc(CONFIG.SUPABASE_URL)+'"');return}
    if(!/^(eyJ|sb_publishable_|sb_anon_)/.test(String(CONFIG.SUPABASE_ANON_KEY).trim())){showFatal('SUPABASE_ANON_KEY tidak sah — mesti bermula "eyJ" atau "sb_publishable_".');return}
    SB=supabase.createClient(CONFIG.SUPABASE_URL.trim(),CONFIG.SUPABASE_ANON_KEY.trim());
    SB.auth.onAuthStateChange(ev=>{
      if(ev==='SIGNED_OUT'&&ME){ME=null;DB=emptyDB();ROUTE=freshROUTE();render()}
    });
    const {data}=await SB.auth.getSession();
    const session=data?data.session:null;
    if(session&&session.user){
      const {data:prof}=await SB.from('profiles').select('*').eq('id',session.user.id).single();
      if(prof&&prof.active!==false){
        ME=mapProfile(prof);
        ROUTE=Object.assign(freshROUTE(),{view:prof.role==='staff'?'staff':'manager',pk:curPeriod()});
        await loadAll();
      }else{await SB.auth.signOut()}
    }
    render();startIdleWatch();
    window.addEventListener('afterprint',()=>{$('#printArea').innerHTML=''});
  }catch(err){
    showFatal((err&&err.message)||String(err));
  }
}
boot();
