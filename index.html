      'Persetujuan ini <b>LOCKED</b> dan tidak boleh diundur.'+
      (agr.agreementIp?'<br>IP: '+esc(agr.agreementIp):'')+'</div>'+
      '<div class="chips" style="margin-top:8px"><button class="btn" onclick="printOfferLetter(\''+agr.id+'\')">🖨️ Muat Turun PDF</button>'+
      '<button class="btn ghost" onclick="closeModal()">Tutup</button></div>';
  }else if(isMgr){
    if(agreed){
      const dt=new Date(agr.agreedAt);
      footer='<div class="notice ok" style="margin-top:14px">✅ Staf telah bersetuju pada <b>'+dt.toLocaleDateString('ms-MY')+' '+
        dt.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'})+'</b>.'+
        (agr.agreementIp?'<br>IP: '+esc(agr.agreementIp):'')+'</div>';
    }else{
      footer='<div class="notice warn" style="margin-top:14px">⏳ Staf BELUM bersetuju. Offer letter di-assign pada '+
        new Date(agr.assignedAt).toLocaleDateString('ms-MY')+'.</div>';
    }
    footer+='<div class="chips" style="margin-top:8px"><button class="btn" onclick="printOfferLetter(\''+agr.id+'\')">🖨️ Muat Turun PDF</button>'+
      '<button class="btn ghost" onclick="closeModal()">Tutup</button></div>';
  }
  body=body+footer;
  const title=agreed?'📄 Offer Letter (Sudah Bersetuju)':'📄 Offer Letter (Pending Persetujuan)';
  openModal(title,body);
}

// ===== STAFF: Submit agreement (RPC) =====
async function submitOfferLetterAgreement(agreementId){
  const me=currentUser();if(!me)return;
  const chk=$('#olAgreeChk');
  if(!chk||!chk.checked)return toast('Sila tick "Saya bersetuju" dahulu','err');
  if(!confirm('Pasti? Selepas sah, persetujuan TIDAK BOLEH diundur.'))return;
  const btn=event&&event.target;if(btn)btn.disabled=true;
  // Get user IP (opsyenal, best-effort)
  let userIp='';
  try{
    const r=await fetch('https://api.ipify.org?format=json');
    const j=await r.json();
    userIp=j.ip||'';
  }catch(e){}
  const {error}=await SB.rpc('agree_offer_letter',{p_agreement_id:agreementId,p_ip:userIp});
  if(btn)btn.disabled=false;
  if(error){
    const m=(error.message||'')+'';;
    if(/sudah bersetuju/i.test(m))return toast('Anda dah bersetuju sebelum ini','err');
    return toast(friendly(error),'err');
  }
  await logAudit('offer_letter_agree_self','Agreement '+agreementId);
  closeModal();await sync();render();
  toast('Persetujuan disahkan ✔ — Tidak boleh diundur','ok');
}

// ===== MANAGER: Bulk assign to all staff without agreement =====
async function bulkAssignOfferLetter(){
  const me=reqMgr();if(!me)return;
  const staffNoAgr=(DB.users||[]).filter(u=>u.role==='staff'&&u.active!==false&&!offerLetterOf(u.id));
  if(!staffNoAgr.length)return toast('Semua staf dah ada offer letter ✔','ok');
  if(!confirm('Assign offer letter ke '+staffNoAgr.length+' staf yang belum ada?\n\n'+
    'Nota: staff yang belum ada IC/bank account dalam profile akan GAGAL assign. '+
    'Manager perlu isi IC/bank manual untuk staf tersebut.'))return;
  toast('⏳ Mula bulk assign...','info');
  let success=0,failed=[];
  for(const s of staffNoAgr){
    try{
      const r=await SB.rpc('assign_offer_letter',{p_staff_id:s.id,p_ic:s.icNumber||'',p_bank_account:s.bankAccount||''});
      if(r.error){
        failed.push(s.name+': '+r.error.message);
      }else{
        success++;
      }
    }catch(e){
      failed.push(s.name+': '+e.message);
    }
  }
  await sync();render();
  if(failed.length){
    toast(success+' berjaya, '+failed.length+' gagal','warn');
    setTimeout(()=>{
      alert('Staf yang gagal (perlu isi IC/bank manual):\n\n'+failed.join('\n'));
    },500);
  }else{
    toast(success+' staf berjaya di-assign ✔','ok');
  }
}

// ===== PRINT: Muat turun offer letter sebagai PDF =====
function printOfferLetter(agreementId){
  const agr=(DB.offerLetterAgreements||[]).find(a=>a.id===agreementId);
  if(!agr)return toast('Agreement tidak dijumpai','err');
  const me=currentUser();if(!me)return;
  const isOwner=(agr.staffId===me.id);
  const isMgr=['manager','admin'].includes(me.role);
  if(!isOwner&&!isMgr)return toast('Akses ditolak','err');
  const staff=DB.users.find(u=>u.id===agr.staffId);
  let body=agr.letterContentSnapshot||'<p>Content tidak dijumpai.</p>';
  // Replace date placeholders
  if(agr.agreedAt){
    const dt=new Date(agr.agreedAt);
    body=body.replace(/\{\{agreed_at\}\}/g,dt.toLocaleDateString('ms-MY')+' '+dt.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'}));
  }else{
    body=body.replace(/\{\{agreed_at\}\}/g,'_______________');
  }
  if(agr.assignedAt){
    body=body.replace(/\{\{assigned_at\}\}/g,new Date(agr.assignedAt).toLocaleDateString('ms-MY'));
  }
  const html='<div class="payslip" style="color:#000">'+
    body+
    '<p class="ps-note" style="margin-top:20px;font-size:10px;color:#666;border-top:1px solid #ccc;padding-top:8px;">'+
    'Dokumen ini dijana oleh Sistem Soobeh TBG.'+(agr.agreedAt?' Persetujuan direkod secara elektronik pada '+new Date(agr.agreedAt).toLocaleString('ms-MY')+' (IP: '+(agr.agreementIp||'—')+').':' Belum disetujui.')+
    '</p></div>';
  const pa=$('#printArea');if(!pa)return;
  pa.innerHTML=html;
  pa.style.display='block';
  const app=$('#app');const oldDisplay=app.style.display;app.style.display='none';
  setTimeout(()=>{
    window.print();
    app.style.display=oldDisplay;
    pa.style.display='none';
    pa.innerHTML='';
  },50);
}

/* ---------- 17h. RESIGN STAFF MODULE (Manager) ---------- */
// Helper: format date untuk display
function fmtDateDMY(d){
  if(!d)return '—';
  const dt=new Date(d+'T00:00:00');
  const pad=n=>String(n).padStart(2,'0');
  return pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+'/'+dt.getFullYear();
}

// Submit resignation (panggil RPC)
async function submitResignStaff(staffId){
  const me=reqMgr();if(!me)return;
  const s=DB.users.find(u=>u.id===staffId);if(!s)return;
  if(s.resignedAt)return toast('Staf dah diproses berhenti','err');
  const date=($('#rsDate')||{}).value||'';
  const reason=($('#rsReason')||{}).value||'';
  const confirm=!!$('#rsConfirm').checked;
  if(!date)return toast('Tarikh berhenti wajib diisi','err');
  if(!confirm)return toast('Sila tick pengesahan dahulu','err');
  // Double-confirm with native dialog
  if(!window.confirm('PASTI? Staf "'+s.name+'" akan ditandakan berhenti pada '+fmtDateDMY(date)+'. SEMUA tempahan & jadual selepas tarikh ini akan DIPADAM. Tindakan TIDAK BOLEH dibatalkan.'))return;
  const btn=event&&event.target;if(btn){btn.disabled=true;btn.textContent='⏳ Memproses...'}
  const {error}=await SB.rpc('resign_staff',{
    p_staff_id:staffId,
    p_resignation_date:date,
    p_reason:reason.trim()
  });
  if(btn){btn.disabled=false;btn.textContent='🚪 Sahkan Berhenti'}
  if(error)return toast(friendly(error),'err');
  closeModal();await sync();render();
  toast('Staf '+s.name+' ditandakan berhenti ✔ — sila assign staf lain ke slot kosong','ok');
}


/* ---------- 18. BOOT (dengan paparan ralat) ---------- */
window.addEventListener('error',e=>showFatal(e.message));
window.addEventListener('unhandledrejection',e=>showFatal((e.reason&&e.reason.message)||String(e.reason)));
function showFatal(msg){
  const r=document.getElementById('app');
  if(r&&!r.innerHTML.trim()){
    r.innerHTML='<div class="landing"><div class="hero glass"><div class="logo big">⚠️</div><h1>Ralat Memuatkan Sistem</h1>'+
    '<p style="opacity:.9">'+esc(msg)+'</p>'+
    '<p class="hint">Semak <b>config.js</b>, pastikan sudah di-commit ke GitHub &amp; Vercel telah re-deploy. Buka <b>/check.html</b> untuk diagnostik penuh.</p></div></div>';
  }
}
async function boot(){
  try{
    if(!window.supabase){ROUTE.view='setup';render();return}
    if(!CONFIG||!CONFIG.SUPABASE_URL||!CONFIG.SUPABASE_ANON_KEY||/GANTI|XXXX/i.test(String(CONFIG.SUPABASE_URL)+String(CONFIG.SUPABASE_ANON_KEY))){ROUTE.view='setup';render();return}
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(String(CONFIG.SUPABASE_URL).trim())){showFatal('SUPABASE_URL tidak sah: "'+esc(CONFIG.SUPABASE_URL)+'"');return}
    if(!/^(eyJ|sb_publishable_|sb_anon_)/.test(String(CONFIG.SUPABASE_ANON_KEY).trim())){showFatal('SUPABASE_ANON_KEY tidak sah — mesti bermula "eyJ" atau "sb_publishable_".');return}
    SB=supabase.createClient(CONFIG.SUPABASE_URL.trim(),CONFIG.SUPABASE_ANON_KEY.trim());
    SB.auth.onAuthStateChange(ev=>{
      if(ev==='SIGNED_OUT'&&ME){ME=null;DB=emptyDB();ROUTE=freshROUTE();render()}
    });
    const {data}=await SB.auth.getSession();
    const session=data?data.session:null;
    if(session&&session.user){
      const {data:prof}=await SB.from('profiles').select('*').eq('id',session.user.id).single();
      if(prof&&prof.active!==false){
        ME=mapProfile(prof);
        ROUTE=Object.assign(freshROUTE(),{view:prof.role==='staff'?'staff':'manager',pk:curPeriod()});
        await loadAll();
      }else{await SB.auth.signOut()}
    }
    render();startIdleWatch();
    window.addEventListener('afterprint',()=>{$('#printArea').innerHTML=''});
  }catch(err){
    showFatal((err&&err.message)||String(err));
  }
}
boot();
