<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#150a0c">
<title>Soobeh TBG — Sistem Jadual Syif & Gaji</title>
<style>
/* SOOBEH TBG — Professional Redesign v2
   Font: Inter (body) + Poppins (headings)
   Palette: Soft pastel red + complementary purple on warm dark
   Style: Refined glassmorphism, cleaner spacing */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap');

:root{
  color-scheme:dark;
  --bg:#150a0c;
  --bg2:#0d0608;
  --txt:#f5ede9;
  --txt-mute:rgba(245,237,233,.6);
  --glass:rgba(255,255,255,.05);
  --glass-brd:rgba(255,255,255,.10);
  --pri:#e57373;
  --pri-d:#ef5350;
  --pri-l:#ffcdd2;
  --sec:#ba68c8;
  --ok:#81c784;
  --warn:#ffb74d;
  --err:#ef5350;
  --r:16px;
  --r-sm:12px;
  --r-lg:20px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  color:var(--txt);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1{font-family:'Poppins',sans-serif;font-size:24px;font-weight:700;margin:4px 0;letter-spacing:-.02em}
h2{font-family:'Poppins',sans-serif;font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
h3{font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;margin:0 0 8px}
h3 small{opacity:.55;font-weight:500}
p{margin:6px 0}
small{font-size:12.5px}
button{font-family:inherit}

/* Background blobs */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.25;z-index:-1;pointer-events:none}
.b1{width:400px;height:400px;background:#e57373;top:-100px;left:-80px;animation:float 19s ease-in-out infinite}
.b2{width:360px;height:360px;background:#ba68c8;bottom:-80px;right:-60px;animation:float 23s ease-in-out infinite reverse}
.b3{width:320px;height:320px;background:#ffab91;bottom:25%;left:50%;animation:float 17s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.08)}}

/* Glass */
.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--glass-brd);
  border-radius:var(--r);
  box-shadow:0 8px 32px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08);
}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:10px 18px;border-radius:var(--r-sm);
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.07);color:#fff;
  font-size:14px;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none;
}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.13)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--pri),var(--pri-d));border-color:transparent;box-shadow:0 6px 20px rgba(229,115,115,.35)}
.btn-ok{background:linear-gradient(135deg,#66bb6a,#81c784);border-color:transparent;box-shadow:0 6px 18px rgba(102,187,106,.3)}
.btn-danger{background:linear-gradient(135deg,#e53935,#ef5350);border-color:transparent;box-shadow:0 6px 18px rgba(229,57,53,.3)}
.btn-big{width:100%;min-height:52px;font-size:15px}
.btn-sm{min-height:38px;padding:6px 12px;font-size:13px;border-radius:10px}
.ghost{background:transparent;border-color:rgba(255,255,255,.18)}

/* Fields */
.field{display:block;margin:10px 0}
.field>span{display:block;font-weight:600;margin-bottom:5px;font-size:13px;opacity:.85}
input,select,textarea{
  width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-sm);color:#fff;padding:12px;
  font-size:15px;font-family:'Inter',sans-serif;
  transition:.15s;
}
input:focus,select:focus,textarea:focus{
  outline:2px solid var(--pri);border-color:var(--pri);
  box-shadow:0 0 0 3px rgba(229,115,115,.15);
}
select option{color:#150a0c;background:#fff}
textarea{resize:vertical}
.formgrid{display:grid;gap:0 14px}
@media(min-width:700px){.formgrid{grid-template-columns:1fr 1fr}}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:600;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--pri)}

/* Landing */
.landing{max-width:680px;margin:0 auto;padding:30px 16px 60px;text-align:center}
.hero{padding:32px 22px;margin-bottom:8px}
.hero p{opacity:.75;margin:6px 0 12px;font-size:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.portalgrid{display:grid;gap:14px;margin-top:16px}
@media(min-width:700px){.portalgrid{grid-template-columns:1fr 1fr}}
.portal{padding:26px 20px;cursor:pointer;text-align:center;color:#fff;display:block}
.portal:hover{transform:translateY(-2px)}
.portal h2{margin:8px 0 4px}
.portal p{opacity:.7;font-size:14px;min-height:42px}
.p-ic{font-size:40px}
.brandlogo{background:#fff;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:4px 10px;height:50px;display:flex;align-items:center;justify-content:center;flex:none}
.brandlogo img{max-height:40px;max-width:160px;width:auto;height:auto;display:block}
.brandlogo.big{height:100px;border-radius:18px;padding:8px 16px}
.brandlogo.big img{max-height:82px;max-width:280px}
.foot{opacity:.5;font-size:12px;margin-top:20px}

/* Login */
.loginwrap{max-width:440px;margin:0 auto;padding:18px 16px 70px}
.loginbox{padding:24px;margin-top:14px;text-align:center}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--sec));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:none}
.logo.big{width:72px;height:72px;font-size:32px;margin:0 auto 10px}
.pin-dots{display:flex;gap:12px;justify-content:center;padding:12px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.dot.on{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:10px auto}
.key{min-height:58px;font-size:24px;font-weight:800;border-radius:14px;color:#fff;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.key:active{transform:scale(.95);background:rgba(255,255,255,.18)}
.loginerr{display:none;margin:10px 0;padding:12px;border-radius:10px;background:rgba(239,83,80,.15);border:1px solid rgba(239,83,80,.45);color:#fecaca;font-weight:700;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{opacity:.6;font-size:13px;margin:8px 0 0}
details.demo{margin-top:14px;padding:0;overflow:hidden}
details.demo summary{cursor:pointer;padding:13px 16px;font-weight:700}
details.demo .inner{padding:0 16px 14px}

/* App bar */
.appbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;margin:10px;border-radius:var(--r);position:sticky;top:8px;z-index:60}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand>div:last-child{min-width:0}
.brand b{display:block;font-size:15px}
.brand small{display:block;opacity:.6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.appbar-actions{display:flex;gap:6px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:19px;cursor:pointer;color:#fff;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.15)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--err);color:#fff;font-size:10px;border-radius:999px;padding:2px 5px;font-weight:800;border:1px solid rgba(255,255,255,.3)}

/* Wrap & layout */
.wrap{max-width:1000px;margin:0 auto;padding:0 14px 120px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.monthnav{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px}
.monthnav b{min-width:110px;text-align:center;font-size:13.5px}
.monthnav button{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer}
.notice{padding:12px 14px;border-radius:var(--r-sm);margin:8px 0;font-size:14px;border:1px solid;line-height:1.5}
.notice.info{background:rgba(186,104,200,.10);border-color:rgba(186,104,200,.35)}
.notice.ok{background:rgba(102,187,106,.10);border-color:rgba(102,187,106,.35)}
.notice.warn{background:rgba(255,167,38,.10);border-color:rgba(255,167,38,.4);color:#ffe0b2}

/* Chips */
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#e2e8f0}
.chip-ok{background:rgba(102,187,106,.12);border-color:rgba(102,187,106,.45);color:#c5e1a5}
.chip-wait{background:rgba(255,167,38,.12);border-color:rgba(255,167,38,.45);color:#ffe0b2}
.chip-no{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.35);color:#b0bec5}
.chip-info{background:rgba(186,104,200,.12);border-color:rgba(186,104,200,.4);color:#ce93d8}
.chip-warn{background:rgba(239,83,80,.12);border-color:rgba(239,83,80,.4);color:#ef9a9a}

/* Cards */
.card{padding:16px;margin:10px 0}
.card>p{opacity:.75}
.detailrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.10);font-size:14px;flex-wrap:wrap}
.detailrow:last-child{border-bottom:0}
.detailrow span{opacity:.65}
.sect{margin:18px 0 6px;font-size:16px;opacity:.85;font-weight:600}
.seclist{padding-left:18px;margin:6px 0}
.seclist li{margin:8px 0;font-size:14px}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:10px}
.cal-dow{text-align:center;font-weight:700;opacity:.55;font-size:11.5px;padding:3px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-cell{min-height:80px;border-radius:11px;background:rgba(255,255,255,.04);padding:5px;display:flex;flex-direction:column;gap:3px}
.cal-cell.blank{background:transparent}
.cal-cell.past{opacity:.45}
.cal-cell.locked{opacity:.3}
.cal-day{font-size:12px;font-weight:800;text-align:center;opacity:.8}
.slot{border:0;border-radius:8px;padding:4px;font-size:11px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#fff;min-height:28px;transition:.12s}
.slot:hover{filter:brightness(1.2)}
.slot:active{transform:scale(.92)}
.st-ok{background:rgba(102,187,106,.22);box-shadow:inset 0 0 0 1.5px rgba(102,187,106,.65)}
.st-wait{background:rgba(255,167,38,.22);box-shadow:inset 0 0 0 1.5px rgba(255,167,38,.65)}
.st-no{background:rgba(148,163,184,.12);box-shadow:inset 0 0 0 1.5px rgba(148,163,184,.35);opacity:.8}

/* Stat grid */
.statgrid{display:grid;gap:12px;margin:10px 0}
@media(min-width:840px){.statgrid{grid-template-columns:1fr 1fr}}
.bigtotal{font-size:26px;font-weight:800;color:#fff;margin:4px 0}

/* Bottom nav (staff) */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));width:calc(100% - 16px);max-width:540px;display:flex;justify-content:space-around;padding:6px;z-index:80;border-radius:var(--r)}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:0;color:var(--txt-mute);cursor:pointer;padding:4px 8px;font-size:11px;font-weight:600}
.navbtn.active{color:var(--pri)}
.navbtn .ic{font-size:18px}

/* Pill nav (manager) */
.pillnav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:6px;margin-bottom:10px}
.pillnav::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.05);color:var(--txt-mute);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s}
.pill:hover{background:rgba(255,255,255,.1)}
.pill.active{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(229,115,115,.3)}

/* Table */
.tblwrap{overflow-x:auto;margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;border-bottom:1px solid rgba(255,255,255,.12);font-weight:700}
.tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.tbl .num{text-align:right}

/* Toast */
#toastWrap{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:6px;width:min(90vw,400px)}
.toast{padding:11px 16px;border-radius:10px;background:rgba(20,10,12,.95);border:1px solid var(--glass-brd);color:#fff;font-size:14px;font-weight:600;backdrop-filter:blur(10px);animation:tin .3s}
.toast.ok{border-color:var(--ok);color:#c5e1a5}
.toast.err{border-color:var(--err);color:#ef9a9a}
.toast.info{border-color:var(--sec)}
.toast.warn{border-color:var(--warn);color:#ffe0b2}
.toast.out{opacity:0;transform:translateY(-10px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* Modal */
#modalRoot{position:fixed;inset:0;z-index:300;display:none;align-items:flex-start;justify-content:center;padding:20px 12px 40px;overflow-y:auto;background:rgba(10,5,6,.6);backdrop-filter:blur(4px)}
#modalRoot.open{display:flex}
.modal{max-width:600px;width:100%;margin:auto;padding:0;border-radius:var(--r-lg);overflow:hidden}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--glass-brd)}
.modal-head h3{margin:0;font-size:15px}
.modal-body{padding:16px;max-height:70vh;overflow-y:auto}

/* Print */
#printArea{display:none}
.payslip{background:#fff;color:#000;padding:20px;font-family:'Inter',sans-serif;font-size:12px;line-height:1.5}
.payslip h1{font-size:18px;text-align:center;color:#000}
.payslip table{width:100%;border-collapse:collapse;font-size:11px}
.payslip th,.payslip td{border:1px solid #999;padding:6px}
.payslip th{background:#f0f0f0}
.payslip .ps-head{display:flex;justify-content:space-between;margin-bottom:10px}
.payslip .ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;font-size:11.5px;margin-bottom:4px}
.payslip .ps-total{border:2px solid #000;padding:8px;display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-top:8px}
.payslip .ps-note{font-size:10px;color:#333;margin-top:10px}
.payslip .ps-sign{margin-top:24px;display:flex;justify-content:space-between;font-size:11px}
.payslip tr{page-break-inside:avoid}

/* Profile avatar */
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--sec));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff;overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.2);object-fit:cover}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:38px;height:38px;font-size:16px;border-radius:50%}
.avatar.lg{width:100px;height:100px;font-size:42px}
.avatar-up{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.avatar-up .btn{flex:none}
.profile-info-row{display:flex;align-items:center;gap:10px;margin:8px 0}

/* Staff compact card */
.staff-compact{padding:10px 12px !important}
.staff-compact .staff-card-row{gap:10px}
.staff-compact .info b{font-size:15px}
.staff-card-row{display:flex;align-items:center;gap:12px}
.staff-card-row .info{flex:1;min-width:0}
.staff-toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px}
.staff-toggle-row .info{flex:1;min-width:180px}

/* Action grid */
.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:6px 0}
.action-grid .btn{flex-direction:column;text-align:center;line-height:1.3;padding:12px 6px;font-size:12.5px;min-height:auto;gap:3px}
.action-grid .btn .ic{font-size:20px;display:block;margin-bottom:2px}

/* Misc */
.search-input{margin:0 !important;width:100% !important}
.result-count{font-size:12.5px;opacity:.65;margin:5px 2px;font-weight:700}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.brow:last-child{border-bottom:0}
.brow-act{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.shiftblock{margin:6px 0}
.shifttitle{font-weight:700;font-size:13px;margin-bottom:4px;opacity:.9}
.consign-view{margin-top:8px}
.consign-toolbar{margin:6px 0 12px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.consign-toolbar .btn span{margin-right:3px}
.empty-state{text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-state-sm{padding:14px 12px}
.empty-state .empty-ic{font-size:48px;line-height:1;opacity:.65;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2));margin-bottom:4px}
.empty-state-sm .empty-ic{font-size:32px}
.empty-state h3{margin:0;font-size:16px}
.empty-state p{margin:3px 0 8px;opacity:.65;font-size:13px;max-width:320px}
.consign-card{padding:12px 14px}
.consign-card-head{display:flex;align-items:center;gap:10px}
.consign-card-info{flex:1;min-width:0}
.consign-card-title{font-size:15px;font-weight:800;margin-bottom:3px;line-height:1.3}
.consign-card-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.consign-card-stats{display:flex;gap:16px;margin-top:10px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.10)}
.consign-card-stats .mini-stat{display:flex;flex-direction:column}
.consign-card-stats .mini-stat b{font-size:16px;font-weight:800;line-height:1}
.consign-card-stats .mini-stat small{font-size:10.5px;opacity:.55;margin-top:2px}
.consign-card-notes{margin:8px 0 0;font-size:12.5px;opacity:.65}
.consign-card.pending-card{border-color:rgba(255,167,38,.30) !important;background:linear-gradient(180deg,rgba(255,167,38,.05),rgba(255,255,255,.02)) !important}
.consign-card.paid-card{border-color:rgba(102,187,106,.30) !important}
.consign-summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0 16px}
.consign-summary-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px}
.consign-item-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin:5px 0;align-items:center}
@media(max-width:760px){.consign-item-row{grid-template-columns:1fr;gap:3px}}
.consign-item-row input,.consign-item-row select{min-height:38px}
.consign-subtotal{font-weight:800;white-space:nowrap;text-align:right;padding:0 4px}
.consign-item-row .btn-danger{padding:0 8px;min-height:38px;font-size:14px}
.consign-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0 14px}
.stat-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px}
.stat-card .stat-ic{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(255,255,255,.07);flex:none}
.stat-card .stat-info{flex:1;min-width:0}
.stat-card .stat-info b{display:block;font-size:17px;font-weight:800;line-height:1.1;letter-spacing:-.01em}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";
/* =====================================================================
   SOOBEH — Sistem Jadual Syif & Gaji (Fasa 1, PRD v1.0)
   KITARAN TEMPOHAN 2 MINGGU: Tempoh 1 (1–15) & Tempoh 2 (16–akhir)
   + Manager assign staff ke slot kosong & tarikh lampau (kecemasan)
   ===================================================================== */

/* ---------- 1. UTILITI ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad2(n){return String(n).padStart(2,'0')}
function rm(n){return 'RM '+(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rm2(n){return 'RM '+(n||0).toFixed(2)}
const HARI=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const BLN=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const DOW=['Isn','Sel','Rab','Kha','Jum','Sab','Aha'];
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function todayStr(){return ymd(new Date())}
function monthKey(ds){return ds.slice(0,7)}
function daysInMonth(mk){const p=mk.split('-');return new Date(+p[0],+p[1],0).getDate()}
function isWeekend(ds){const w=new Date(ds+'T00:00:00').getDay();return w===0||w===6}
function shiftMonth(mk,delta){const p=mk.split('-');return ymd(new Date(+p[0],+p[1]-1+delta,1)).slice(0,7)}
function fmtDateDS(ds){const d=new Date(ds+'T00:00:00');return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()}
function dShort(ds){const d=new Date(ds+'T00:00:00');return d.getDate()+' '+BLN[d.getMonth()].slice(0,3)+' '+d.getFullYear()}
function monthLabel(mk){const p=mk.split('-');return BLN[+p[1]-1]+' '+p[0]}
function ago(t){const s=Math.floor((Date.now()-t)/1000);if(s<60)return 'baru sebentar';if(s<3600)return Math.floor(s/60)+' minit lalu';if(s<86400)return Math.floor(s/3600)+' jam lalu';return Math.floor(s/86400)+' hari lalu'}
function nextDay(ds){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+1);return ymd(d)}

/* ---------- TEMPOH 2 MINGGU (kitaran baharu) ---------- */
function periodOf(ds){return ds.slice(0,7)+((+ds.slice(8,10))<=15?'-A':'-B')}
function periodBounds(pk){const mk=pk.slice(0,7);return pk.endsWith('A')?[mk+'-01',mk+'-15']:[mk+'-16',mk+'-'+pad2(daysInMonth(mk))]}
function periodLabel(pk){const b=periodBounds(pk);return 'Tempoh '+(pk.endsWith('A')?'1':'2')+' · '+dShort(b[0])+' – '+dShort(b[1])}
function curPeriod(){return periodOf(todayStr())}
function nextPeriod(pk){const mk=pk.slice(0,7);return pk.endsWith('A')?mk+'-B':shiftMonth(mk,1)+'-A'}
function prevPeriod(pk){const mk=pk.slice(0,7);return pk.endsWith('B')?mk+'-A':shiftMonth(mk,-1)+'-B'}
function shiftPeriod(pk,d){let p=pk;for(let i=0;i<Math.abs(d);i++)p=d>0?nextPeriod(p):prevPeriod(p);return p}
function bookingWindowEnd(){return periodBounds(nextPeriod(curPeriod()))[1]}

/* ---------- 2. SAMBUNGAN SUPABASE ---------- */
let SB=null, ME=null;
const DEF_SET={baseRate:8,highRate:9,weekdayThreshold:300,weekendThreshold:400,monthlySalesThreshold:3000,perfBonus:100,attBonus:30,typhoidAllowance:10,typhoidMax:5,maxPerShift:2,shiftHours:6,allowStaffSales:false,typhoidEnabled:true,attBonusEnabled:false,storeLat:null,storeLng:null,geofenceRadius:50};
function emptyDB(){return {users:[],bookings:[],schedule:[],swaps:[],sales:[],payslips:[],notifications:[],audit:[],deductions:[],attendance:[],tasks:[],expenses:[],fixedCosts:[],published:{},settings:Object.assign({},DEF_SET),slotMonths:{},consignors:[],consignProducts:[],consignReceipts:[],consignReceiptItems:[],consignPayments:[],customTasks:[]}}
let DB=emptyDB();

/* ---------- 3. PENGURUSAN DATA ---------- */
const mapProfile=r=>({id:r.id,username:r.username,name:r.name,phone:r.phone||'—',role:r.role,payCycle:r.pay_cycle,typhoidCount:r.typhoid_count,active:r.active,defaultHours:r.default_hours!=null?+r.default_hours:null,address:r.address||'',avatarUrl:r.avatar_url||'',maritalStatus:r.marital_status||'',icNumber:r.ic_number||'',bankName:r.bank_name||'',bankAccount:r.bank_account||'',resignedAt:r.resigned_at?Date.parse(r.resigned_at):null,resignationDate:r.resignation_date||null,resignationReason:r.resignation_reason||'',emergencyName:r.emergency_name||'',emergencyRelationship:r.emergency_relationship||'',emergencyAddress:r.emergency_address||'',emergencyPhone:r.emergency_phone||''});
function usernameOf(id){if(!id)return null;const u=DB.users.find(x=>x.id===id);return u?u.username:null}
const mapBooking=(r)=>({id:r.id,staffId:r.staff_id,date:r.date,shift:r.shift,status:r.status,t:Date.parse(r.created_at),by:usernameOf(r.decided_by)});
const mapSchedule=(r)=>({id:r.id,monthKey:r.date.slice(0,7),date:r.date,shift:r.shift,staffId:r.staff_id,noShow:r.no_show,hours:r.hours!=null?+r.hours:null});
const mapSwap=(r)=>({id:r.id,entryId:r.entry_id,exchangeEntryId:r.exchange_entry_id,fromStaffId:r.from_staff,toStaffId:r.to_staff,reason:r.reason||'',status:r.status,t:Date.parse(r.created_at),tPeer:r.t_peer?Date.parse(r.t_peer):null,tMgr:r.t_mgr?Date.parse(r.t_mgr):null,by:usernameOf(r.decided_by)});
const mapSale=(r)=>({date:r.date,shift:r.shift,amount:+r.amount,by:usernameOf(r.entered_by),t:Date.parse(r.updated_at)});
const mapPayslip=(r)=>Object.assign({id:r.id,staffId:r.staff_id,monthKey:r.start.slice(0,7)},r.payload||{});
const mapNotif=(r)=>({id:r.id,userId:r.user_id,msg:r.msg,read:r.read,t:Date.parse(r.created_at)});
const mapAudit=(r)=>({t:Date.parse(r.at),by:r.by_username||'system',action:r.action,detail:r.detail||''});
const mapSettings=(r)=>r?{baseRate:+r.base_rate,highRate:+r.high_rate,weekdayThreshold:+r.weekday_threshold,weekendThreshold:+r.weekend_threshold,monthlySalesThreshold:+r.monthly_sales_threshold,perfBonus:+r.perf_bonus,attBonus:+r.att_bonus,typhoidAllowance:+r.typhoid_allowance,typhoidMax:+r.typhoid_max,maxPerShift:+r.max_per_shift,shiftHours:+r.shift_hours,allowStaffSales:!!r.allow_staff_sales,typhoidEnabled:r.typhoid_enabled!==false,attBonusEnabled:r.att_bonus_enabled===true,storeLat:r.store_lat!=null?+r.store_lat:null,storeLng:r.store_lng!=null?+r.store_lng:null,geofenceRadius:+r.geofence_radius||50}:Object.assign({},DEF_SET);

async function loadAll(){
  if(!ME)return;
  const isMgr=['manager','admin'].includes(ME.role);
  const q=await Promise.all([
    SB.from('profiles').select('*').order('name'),
    SB.from('bookings').select('*'),
    SB.from('schedule').select('*'),
    SB.from('published').select('*'),
    SB.from('swaps').select('*'),
    SB.from('sales').select('*'),
    SB.from('payslips').select('*'),
    SB.from('notifications').select('*').order('created_at',{ascending:false}).limit(150),
    SB.from('settings').select('*').eq('id',1)
  ]);
  if(q[0].error)return toast('Gagal memuatkan data: '+friendly(q[0].error),'err');
  DB.users=(q[0].data||[]).map(mapProfile);
  DB.bookings=(q[1].data||[]).map(mapBooking);
  DB.schedule=(q[2].data||[]).map(mapSchedule);
  DB.published={};(q[3].data||[]).forEach(r=>{DB.published[r.period_key]={t:Date.parse(r.published_at),by:usernameOf(r.published_by)}});
  DB.swaps=(q[4].data||[]).map(mapSwap);
  DB.sales=(q[5].data||[]).map(mapSale);
  DB.payslips=(q[6].data||[]).map(mapPayslip);
  DB.notifications=(q[7].data||[]).map(mapNotif);
  DB.settings=mapSettings((q[8].data||[])[0]);
  const dd=await SB.from('deductions').select('*').order('created_at',{ascending:false});
  DB.deductions=(dd.data||[]).map(r=>({id:r.id,staffId:r.staff_id,periodStart:r.period_start,amount:+r.amount,reason:r.reason||'',t:Date.parse(r.created_at)}));
  const att=await SB.from('attendance').select('*').order('date',{ascending:false}).limit(500);
  DB.attendance=(att.data||[]).map(r=>({id:r.id,staffId:r.staff_id,date:r.date,shift:r.shift,punchIn:r.punch_in?Date.parse(r.punch_in):null,punchOut:r.punch_out?Date.parse(r.punch_out):null,late:!!r.late,dist:r.pin_dist!=null?+r.pin_dist:null,lateOverride:!!r.late_override,overrideReason:r.override_reason||'',overrideBy:r.override_by,overrideAt:r.override_at?Date.parse(r.override_at):null}));
  const tk=await SB.from('tasks').select('*').order('date',{ascending:false}).limit(400);
  DB.tasks=(tk.data||[]).map(r=>({id:r.id,date:r.date,shift:r.shift,template:r.template,note:r.note||'',status:r.status,data:r.data||null,submittedBy:r.submitted_by,submittedAt:r.submitted_at?Date.parse(r.submitted_at):null,late:!!r.late_submit,ackedAt:r.acked_at?Date.parse(r.acked_at):null,t:Date.parse(r.created_at)}));
  if(isMgr){
    const ex=await SB.from('expenses').select('*').order('date',{ascending:false}).limit(600);
    DB.expenses=(ex.data||[]).map(r=>({id:r.id,date:r.date,category:r.category,amount:+r.amount,note:r.note||'',t:Date.parse(r.created_at)}));
    const fc=await SB.from('fixed_costs').select('*').order('created_at');
    DB.fixedCosts=(fc.data||[]).map(r=>({id:r.id,category:r.category,label:r.label,amount:+r.amount,day:r.day_of_month,active:!!r.active}));
  }
  if(isMgr){
    const a=await SB.from('audit').select('*').order('at',{ascending:false}).limit(300);
    DB.audit=(a.data||[]).map(mapAudit);
    // Consign module data
    const cs=[
      SB.from('consignors').select('*').order('name'),
      SB.from('consign_products').select('*').order('name'),
      SB.from('consign_receipts').select('*').order('received_date',{ascending:false}).limit(200)
    ];
    const cq=await Promise.all(cs);
    DB.consignors=(cq[0].data||[]).map(mapConsignor);
    DB.consignProducts=(cq[1].data||[]).map(mapConsignProduct);
    DB.consignReceipts=(cq[2].data||[]).map(mapConsignReceipt);
    if(DB.consignReceipts.length){
      const rids=DB.consignReceipts.map(r=>r.id);
      const items=await SB.from('consign_receipt_items').select('*').in('receipt_id',rids);
      DB.consignReceiptItems=(items.data||[]).map(mapConsignReceiptItem);
      const pays=await SB.from('consign_payments').select('*').order('payment_date',{ascending:false}).limit(200);
      DB.consignPayments=(pays.data||[]).map(mapConsignPayment);
    }else{
      DB.consignReceiptItems=[];DB.consignPayments=[];
    }
    // Custom tasks (manager only)
    const ct=await SB.from('custom_tasks').select('*').order('created_at',{ascending:false}).limit(200);
    DB.customTasks=(ct.data||[]).map(mapCustomTask);
  }
  // Offer letter (ALL users - staff fetch own via RLS)
  const olt=await SB.from('offer_letter_template').select('*').eq('id',1).maybeSingle();
  DB.offerLetterTemplate=olt.data?{title:olt.data.title,contentHtml:olt.data.content_html,updatedAt:Date.parse(olt.data.updated_at)}:null;
  const ola=await SB.from('offer_letter_agreements').select('*').order('assigned_at',{ascending:false}).limit(200);
  DB.offerLetterAgreements=(ola.data||[]).map(mapOfferLetterAgreement);
}
async function sync(){await loadAll()}
async function syncNow(){if(!ME)return;DB.slotMonths={};await sync();render();toast('Data dikemaskini 🔄','ok')}
function slotCount(ds,shift){const m=DB.slotMonths[monthKey(ds)];return m?(m[ds+'|'+shift]||0):0}
async function ensureSlotCounts(mk){ /* kiraan rakan per slot (tanpa nama) — cache ikut bulan */
  if(!ME||ME.role!=='staff'||!mk||DB.slotMonths[mk]!==undefined)return;
  DB.slotMonths[mk]={};
  try{const {data,error}=await SB.rpc('slot_counts',{p_month:mk});
    if(!error&&data)data.forEach(r=>{if(r.d)DB.slotMonths[mk][r.d+'|'+r.shift]=r.n});
  }catch(e){}
  render();
}

/* ---------- 4. SESI, AUDIT, NOTIFIKASI ---------- */
function currentUser(){return ME}
function reqMgr(){const u=currentUser();if(!u||!['manager','admin'].includes(u.role)){toast('Akses ditolak 🔒','err');return null}return u}
function freshROUTE(){return {view:'landing',portal:'staff',tab:'cal',mtab:'dash',pk:null,bpk:null,spk:null,pmk:null,saleEdit:null,lrmk:null,lrStaff:null,ltmk:null,fmk:null,emk:null,staffSearch:null,consignSub:'consignors'}}
async function logout(msg){
  if(ME)await logAudit('logout',ME.username);
  try{await SB.auth.signOut()}catch(e){}
  ME=null;DB=emptyDB();ROUTE=freshROUTE();pinBuf='';render();if(msg)toast(msg,'info');
}
function startIdleWatch(){let last=Date.now();
  ['click','keydown','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,()=>{last=Date.now()},{capture:true,passive:true}));
  setInterval(()=>{if(ME&&Date.now()-last>30*60*1000)logout('🔒 Auto log keluar: 30 minit tidak aktif')},20000);
}
async function logAudit(action,detail){try{await SB.from('audit').insert({action:action,detail:detail||''})}catch(e){}}
async function notifyUsers(ids,msg){try{const list=(ids||[]).filter(Boolean).map(id=>({user_id:id,msg:msg}));if(list.length)await SB.from('notifications').insert(list)}catch(e){}}
async function notifyManagers(msg){await notifyUsers(DB.users.filter(u=>(u.role==='manager'||u.role==='admin')&&u.active!==false).map(u=>u.id),msg)}
function friendly(e){const m=(e&&e.message)||String(e||'Ralat');
  if(/publish_period|PGRST202/i.test(m))return 'Jalankan 05_upgrade_2week.sql di Supabase SQL Editor dahulu';
  if(/duplicate key/i.test(m))return 'Rekod ini sudah wujud';
  if(/row-level security/i.test(m))return 'Akses ditolak 🔒';
  return m}
function bellHTML(){const u=currentUser();if(!u)return '';const c=DB.notifications.filter(n=>n.userId===u.id&&!n.read).length;return '<button class="iconbtn" onclick="openNotifs()" aria-label="Notifikasi">🔔'+(c?'<span class="badge">'+c+'</span>':'')+'</button>'}
async function openNotifs(){
  const u=currentUser();if(!u)return;
  const ns=DB.notifications.filter(n=>n.userId===u.id).sort((a,b)=>b.t-a.t).slice(0,40);
  openModal('🔔 Notifikasi',ns.length?ns.map(n=>'<div class="notif '+(n.read?'':'unread')+'"><small>'+ago(n.t)+'</small><div>'+esc(n.msg)+'</div></div>').join(''):'<p style="opacity:.7">Tiada notifikasi.</p>');
  if(ns.some(n=>!n.read)){try{await SB.from('notifications').update({read:true}).eq('user_id',u.id).eq('read',false)}catch(e){};await sync()}
  render();
}

/* ---------- 5. LOGIK PERNIAGAAN (PRD Seksyen 6 — dinilai SETIAP SYIF) ---------- */
function getSale(date,shift){const s=DB.sales.find(x=>x.date===date&&x.shift===shift);return s?s.amount:null}
function shiftRate(ds,shift,sale){const S=DB.settings;const th=isWeekend(ds)?S.weekendThreshold:S.weekdayThreshold;return (sale!=null&&sale>th)?S.highRate:S.baseRate}
function periodPublished(pk){return !!DB.published[pk]}
function scheduledEntries(staffId,mk){ /* gabung: jadual (termasuk ASSIGN manager) + tempahan disahkan */
  let out=[];
  [mk+'-A',mk+'-B'].forEach(pk=>{
    const b=periodBounds(pk);
    const inR=x=>x.date>=b[0]&&x.date<=b[1];
    if(DB.published[pk]){
      out=out.concat(DB.schedule.filter(x=>inR(x)&&x.staffId===staffId));
    }else{
      const key=e=>e.date+'|'+e.shift;
      const sc=DB.schedule.filter(x=>inR(x)&&x.staffId===staffId); /* tugasan terus manager (termasuk tarikh lampau) */
      const seen=new Set(sc.map(key));
      const bk=DB.bookings.filter(x=>inR(x)&&x.staffId===staffId&&x.status==='approved'&&!seen.has(key(x))).map(x=>({date:x.date,shift:x.shift,noShow:false}));
      out=out.concat(sc).concat(bk);
    }
  });
  return out;
}
function computeCycle(staffId,pStart,pEnd){
  const S=DB.settings,mk=monthKey(pStart);
  const stf=DB.users.find(u=>u.id===staffId)||{};
  const entries=scheduledEntries(staffId,mk).filter(e=>!e.noShow&&e.date>=pStart&&e.date<=pEnd);
  const shifts=[];let totalHours=0,basePay=0,highHours=0,extraPay=0,salesSum=0;
  entries.forEach(e=>{
    const sale=getSale(e.date,e.shift),rate=shiftRate(e.date,e.shift,sale),hours=(e.hours!=null?e.hours:(stf.defaultHours!=null?stf.defaultHours:S.shiftHours)),amount=hours*rate;
    totalHours+=hours;basePay+=hours*S.baseRate;
    if(rate>S.baseRate){highHours+=hours;extraPay+=hours*(S.highRate-S.baseRate)}
    if(sale!=null)salesSum+=sale;
    shifts.push({date:e.date,shift:e.shift,hours:hours,sale:sale,rate:rate,amount:amount});
  });
  shifts.sort((a,b)=>a.date.localeCompare(b.date));
  return {shifts:shifts,totalHours:totalHours,basePay:basePay,highHours:highHours,extraPay:extraPay,salesSum:salesSum};
}
function perfEligible(staffId,mk){
  // Pemohon (from_staff) of APPROVED swap = NOT eligible (pengganti yang layak)
  const isPemohon=DB.swaps.some(s=>{
    if(s.status!=='approved')return false;
    if(s.fromStaffId!==staffId)return false;
    const e=DB.schedule.find(x=>x.id===s.entryId);
    return e&&monthKey(e.date)===mk;
  });
  if(isPemohon)return {ok:false,sum:0,why:'Pemohon pertukaran syif (approved)'};
  const sum=scheduledEntries(staffId,mk).filter(e=>!e.noShow).reduce((a,e)=>a+(getSale(e.date,e.shift)||0),0);
  return {ok:sum>DB.settings.monthlySalesThreshold,sum:sum};
}
function attEligible(staffId,mk){
  const sched=scheduledEntries(staffId,mk);
  if(!sched.length)return {ok:false,why:'Tiada syif dijadualkan bulan ini'};
  // 1. MINIMUM 15 syif sebulan (polisi baharu)
  const MIN_SHIFTS_FOR_ATT_BONUS=15;
  if(sched.length<MIN_SHIFTS_FOR_ATT_BONUS)return {ok:false,why:'Syif kurang daripada '+MIN_SHIFTS_FOR_ATT_BONUS+' sebulan ('+sched.length+' syif sahaja) - minimum 15 syif diperlukan'};
  // 2. Hadir penuh (tiada noShow)
  if(sched.some(e=>e.noShow))return {ok:false,why:'Terdapat rekod tidak hadir (noShow)'};
  // 3. Pemohon (from_staff) of APPROVED swap only = NOT eligible (polisi lama)
  const isPemohonApproved=DB.swaps.some(s=>{
    if(s.status!=='approved')return false;
    if(s.fromStaffId!==staffId)return false;
    const e=DB.schedule.find(x=>x.id===s.entryId);
    return e&&monthKey(e.date)===mk;
  });
  if(isPemohonApproved)return {ok:false,why:'Pemohon pertukaran syif (approved)'};
  // 4. Tak pernah lambat punch in (kecuali diluluskan manager override)
  if(DB.attendance.some(a=>a.staffId===staffId&&monthKey(a.date)===mk&&a.late&&!a.lateOverride))return {ok:false,why:'Terdapat rekod punch-in LAMBAT (belum diluluskan manager)'};
  return {ok:true,why:''};
}
function estimateFor(staffId){
  const S=DB.settings,mk=monthKey(todayStr());
  const c=computeCycle(staffId,mk+'-01',todayStr());
  const perf=perfEligible(staffId,mk),att=attEligible(staffId,mk);
  const st=DB.users.find(u=>u.id===staffId)||{};
  const typh=(S.typhoidEnabled!==false&&st.typhoidCount<S.typhoidMax)?S.typhoidAllowance:0;
  const deduct=DB.deductions.filter(d=>d.staffId===staffId&&monthKey(d.periodStart)===mk).reduce((a,d)=>a+d.amount,0);
  return {c:c,perf:perf,att:att,typh:typh,deduct:deduct,total:c.basePay+c.extraPay+(perf.ok?S.perfBonus:0)+((att.ok&&S.attBonusEnabled)?S.attBonus:0)+typh-deduct};
}

/* ---------- 6. SLIP GAJI ---------- */
async function generatePayslip(staffId,pStart,pEnd){
  const staff=DB.users.find(u=>u.id===staffId);
  if(!staff||staff.role!=='staff')return {ok:false,msg:'Staff tidak sah'};
  if(DB.payslips.some(p=>p.staffId===staffId&&p.start===pStart))return {ok:false,msg:staff.name+' — slip tempoh ini sudah dijana'};
  const S=DB.settings,mk=monthKey(pStart);
  const c=computeCycle(staffId,pStart,pEnd);
  const perf=perfEligible(staffId,mk),att=attEligible(staffId,mk);
  const secondHalf=pStart.slice(8,10)==='15';
  const includeBonus=staff.payCycle==='monthly'?true:secondHalf;
  const typhCountBefore=staff.typhoidCount;
  const typh=(S.typhoidEnabled!==false&&typhCountBefore<S.typhoidMax)?S.typhoidAllowance:0;
  if(typh)staff.typhoidCount++;
  const perfAmt=(includeBonus&&perf.ok)?S.perfBonus:0;
  const attAmt=(includeBonus&&att.ok&&S.attBonusEnabled)?S.attBonus:0;
  const deducts=DB.deductions.filter(d=>d.staffId===staffId&&d.periodStart===pStart);
  const deductAmt=deducts.reduce((a,d)=>a+d.amount,0);
  const total=c.basePay+c.extraPay+perfAmt+attAmt+typh-deductAmt;
  const slip={staffName:staff.name,username:staff.username,cycle:staff.payCycle,start:pStart,end:pEnd,
    shiftCount:c.shifts.length,hours:c.totalHours,basePay:c.basePay,highHours:c.highHours,extraPay:c.extraPay,
    salesSum:c.salesSum,perfSum:perf.sum,perfAmt:perfAmt,attAmt:attAmt,attWhy:att.ok?'':att.why,attOff:S.attBonusEnabled!==true,includeBonus:includeBonus,
    typh:typh,typhNo:typh?typhCountBefore+1:null,typhCountBefore:typhCountBefore,typhOff:S.typhoidEnabled===false,deductionAmt:deductAmt,deductions:deducts.map(d=>({amount:d.amount,reason:d.reason})),total:total,shifts:c.shifts,
    t:Date.now(),by:ME.username};
  const {error}=await SB.from('payslips').insert({staff_id:staffId,start:pStart,end:pEnd,cycle:staff.payCycle,payload:slip,created_by:ME.id});
  if(error){if(typh)staff.typhoidCount--;if(/duplicate/i.test(error.message||''))return {ok:false,msg:staff.name+' — slip tempoh ini sudah dijana'};return {ok:false,msg:friendly(error)}}
  if(typh){try{await SB.from('profiles').update({typhoid_count:staff.typhoidCount}).eq('id',staffId)}catch(e){}}
  await notifyUsers([staffId],'🧾 Slip gaji anda untuk '+dShort(pStart)+' – '+dShort(pEnd)+' telah dijana ('+rm(total)+'). Semak tab "Slip Gaji".');
  await logAudit('payslip_gen',staff.username+' · '+dShort(pStart)+'–'+dShort(pEnd)+' · '+rm(total));
  return {ok:true};
}
async function genPayslips(kind){
  const u=reqMgr();if(!u)return;
  const mk=ROUTE.pmk,dim=daysInMonth(mk);let start,end,cyc;
  if(kind==='M'){start=mk+'-01';end=mk+'-'+pad2(dim);cyc='monthly'}
  else if(kind==='B1'){start=mk+'-01';end=mk+'-14';cyc='biweekly'}
  else{start=mk+'-15';end=mk+'-'+pad2(dim);cyc='biweekly'}
  const list=DB.users.filter(x=>x.role==='staff'&&x.active!==false&&x.payCycle===cyc);
  if(!list.length)return toast('Tiada staff dalam kumpulan ini','err');
  let ok=0,skip=0;
  for(const x of list){const r=await generatePayslip(x.id,start,end);r.ok?ok++:skip++}
  await logAudit('payslip_group','Kitaran '+cyc+' '+monthLabel(mk)+' — '+ok+' slip');
  await sync();render();
  toast('Jana slip '+dShort(start)+' – '+dShort(end)+': '+ok+' berjaya'+(skip?', '+skip+' dilangkau (sudah wujud)':'')+' ✔','ok');
}

/* ---------- 7. MODUL TEMPAHAN SYIF (kitaran 2 minggu — PRD 5.2/5.3) ---------- */
async function submitBooking(ds,shift){
  if(!ME||ME.role!=='staff')return {ok:false,msg:'Akses ditolak'};
  if(periodPublished(periodOf(ds)))return {ok:false,msg:'Jadual tempoh ini telah dikunci — guna Pertukaran Syif'};
  if(ds<=todayStr())return {ok:false,msg:'Tarikh lampau — tempahan tertutup'};
  const winEnd=bookingWindowEnd();
  if(ds>winEnd)return {ok:false,msg:'Tempahan dibenarkan untuk tempoh semasa & tempoh seterusnya sahaja (kitaran 2 minggu)'};
  if(DB.bookings.some(b=>b.staffId===ME.id&&b.date===ds&&b.shift===shift&&(b.status==='pending'||b.status==='approved')))return {ok:false,msg:'Anda sudah menempah slot ini'};
  if(DB.schedule.some(e=>e.staffId===ME.id&&e.date===ds&&e.shift===shift))return {ok:false,msg:'Anda telah ditugaskan pada slot ini oleh manager'};
  const n=slotCount(ds,shift);
  if(n>=DB.settings.maxPerShift)return {ok:false,msg:'Slot penuh (had '+DB.settings.maxPerShift+' staff/syif)'};
  const {error}=await SB.from('bookings').insert({staff_id:ME.id,date:ds,shift:shift,status:'pending'});
  if(error)return {ok:false,msg:friendly(error)};
  await logAudit('booking_submit',fmtDateDS(ds)+' · '+(shift==='morning'?'Pagi':'Petang'));
  await notifyManagers('📋 '+ME.name+' menempah '+fmtDateDS(ds)+' ('+(shift==='morning'?'Pagi':'Petang')+').');
  return {ok:true};
}
async function bookSlot(ds,shift){
  const r=await submitBooking(ds,shift);

function distM(la1,lo1,la2,lo2){const R=6371000,r=Math.PI/180,dLa=(la2-la1)*r,dLo=(lo2-lo1)*r;const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)))}
function fmtT(t){return t?new Date(t).toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'}):'—'}
function renderStaffAttendance(){

  const mine=DB.attendance.filter(a=>a.staffId===u.id&&monthKey(a.date)===mk).sort((a,b)=>b.date.localeCompare(a.date));
  const todays=DB.schedule.filter(e=>e.staffId===u.id&&e.date===todayStr());
  let html='<div class="pagehead"><h2>📍 Attendance (Punch In/Out)</h2></div>';
  if(S.storeLat==null)html+='<div class="notice warn">⚠ Manager belum menetapkan lokasi kedai — punch tidak dapat dibuat buat masa ini.</div>';
  if(!todays.length)html+='<div class="notice info">Tiada syif anda hari ini — punch hanya tersedia pada hari anda bertugas.</div>';
  todays.forEach(e=>{
    const rec=DB.attendance.find(a=>a.staffId===u.id&&a.date===todayStr()&&a.shift===e.shift);
    const startT=e.shift==='morning'?'10:00':'16:00';
    let btn;
    if(!rec||!rec.punchIn)btn='<button class="btn btn-ok btn-big" onclick="doPunch(\''+e.shift+'\',\'in\',this)">🟢 PUNCH IN</button>';
    else if(!rec.punchOut)btn='<button class="btn btn-danger btn-big" onclick="doPunch(\''+e.shift+'\',\'out\',this)">🔴 PUNCH OUT</button>';
    else btn='<div class="notice ok">✔ Syif hari ini lengkap — In '+fmtT(rec.punchIn)+' · Out '+fmtT(rec.punchOut)+'</div>';
    html+='<div class="card glass"><h3>'+(e.shift==='morning'?'☀ Syif Pagi':'🌙 Syif Petang')+' — Hari Ini</h3>'+
    '<div class="detailrow"><span>Syif bermula</span><b>'+startT+'</b></div>'+
    '<div class="detailrow"><span>Punch In</span><b>'+(rec&&rec.punchIn?fmtT(rec.punchIn)+(rec.late?(rec.lateOverride?' <span class="chip chip-ok">✅ Diluluskan</span> <span class="chip chip-warn">(asal LAMBAT)</span>':' <span class="chip chip-warn">LAMBAT</span>'):' <span class="chip chip-ok">tepat</span>'):'—')+'</b></div>'+
    '<div class="detailrow"><span>Punch Out</span><b>'+(rec&&rec.punchOut?fmtT(rec.punchOut):'—')+'</b></div>'+btn+
    '<p class="hint">Butang hanya berfungsi dalam radius '+S.geofenceRadius+'m dari kedai. Punch in selepas '+startT+' = <b>LAMBAT</b> → hilang kelayakan Bonus Kehadiran bulan ini.</p></div>';
  });
  html+='<div class="card glass"><h3>📜 Rekod Kehadiran Bulan Ini ('+mine.length+')</h3>'+
  (mine.length?mine.map(a=>'<div class="brow"><div><b>'+dShort(a.date)+'</b> <span class="chip chip-info">'+(a.shift==='morning'?'☀ Pagi':'🌙 Petang')+'</span></div><div class="chips">'+
  '<span class="chip '+(a.late&&!a.lateOverride?'chip-warn':'chip-ok')+'">In '+fmtT(a.punchIn)+(a.late?(a.lateOverride?' ✅diluluskan':' ⚠LAMBAT'):'')+'</span>'+
  '<span class="chip'+(a.punchOut?' chip-ok':'')+'">Out '+fmtT(a.punchOut)+'</span></div></div>').join(''):'<p style="opacity:.7">Tiada rekod bulan ini.</p>')+'</div>';
  $('#viewRoot').innerHTML=html;
}
async function doPunch(shift,type,btn){
  const u=currentUser();if(!u||u.role!=='staff')return;
  if(!navigator.geolocation)return toast('Pelayar anda tidak menyokong GPS','err');
  const S=DB.settings;
  if(S.storeLat==null)return toast('Manager belum menetapkan lokasi kedai','err');
  const old=btn?btn.textContent:null;if(btn){btn.disabled=true;btn.textContent='📡 Mengesan GPS...'}
  const done=()=>{if(btn){btn.disabled=false;btn.textContent=old}};
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const d=distM(S.storeLat,S.storeLng,lat,lng);
    if(d>S.geofenceRadius){done();return toast('📍 Terlalu jauh: '+d+'m dari kedai (had '+S.geofenceRadius+'m) — hampiri kedai dahulu','err')}
    const {data,error}=await SB.rpc('punch',{p_shift:shift,p_type:type,p_lat:lat,p_lng:lng});
    done();
    if(error)return toast(friendly(error),'err');
    await sync();render();
    toast((type==='in'?'🟢 Punch IN':'🔴 Punch OUT')+' direkodkan '+data.time+' ('+data.dist+'m)'+(data.late?' — LAMBAT ⚠ bonus kehadiran terjejas':' ✔'),'ok');
  },err=>{done();toast('GPS gagal: '+err.message+' — aktifkan lokasi telefon & cuba semula','err')},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

  if(isNaN(lat)||lat<-90||lat>90||isNaN(lng)||lng<-180||lng>180)return toast('Koordinat tidak sah (lat -90..90, lng -180..180)','err');

/* ---------- 14. LOG MASUK ---------- */
let pinBuf='',failCount=0,lockUntil=0;
function renderDots(){const w=$('#pinDots');if(!w)return;
  w.innerHTML=Array.from({length:6},(_,i)=>'<span class="dot'+(i<pinBuf.length?' on':'')+'"></span>').join('');}
function keyPress(k){if(pinBuf.length>=6)return;pinBuf+=k;renderDots()}
function keyBack(){pinBuf=pinBuf.slice(0,-1);renderDots()}
function clearPin(){pinBuf='';renderDots()}
document.addEventListener('keydown',e=>{
  if(ROUTE.view!=='login')return;
  if(e.target&&e.target.tagName==='INPUT'){
    if(e.key==='Enter'&&e.target.id==='loginUser'){doLogin()}
    return;
  }
  if(/^[0-9]$/.test(e.key)){keyPress(e.key);e.preventDefault()}
  else if(e.key==='Backspace'){keyBack();e.preventDefault()}
  else if(e.key==='Enter'){doLogin()}
});
function mapAuthErr(e,left){
  const m=(e&&e.message)||'';
  if(/Invalid login credentials/i.test(m))return 'ID atau PIN salah. ('+left+' percubaan lagi)';
  if(/rate|security purposes|too many/i.test(m))return '🔒 Terlalu banyak percubaan — tunggu sebentar (perlindungan Supabase Auth).';
  if(/not confirmed/i.test(m))return 'Akaun belum disahkan — semak ✓ Auto Confirm di Dashboard.';
  if(/Database error/i.test(m))return 'Ralat database — jalankan 05_upgrade_2week.sql di Supabase SQL Editor.';
  return m||'Log masuk gagal';
}
async function doLogin(){
  const username=($('#loginUser').value||'').trim().toLowerCase(),pin=pinBuf,err=$('#loginErr');
  const showErr=m=>{err.textContent=m;err.style.display='block';err.classList.add('shake');setTimeout(()=>err.classList.remove('shake'),450)};
  if(!username||pin.length<4)return showErr('Sila masukkan ID dan PIN (4–6 digit).');
  if(Date.now()<lockUntil)return showErr('🔒 Cuba lagi dalam '+Math.ceil((lockUntil-Date.now())/1000)+' saat.');
  const portal=ROUTE.portal==='staff'?'staff':'manager';
  const {data,error}=await SB.auth.signInWithPassword({email:username+'@soobeh.app',password:pin+'-soobeh'});
  if(error){
    failCount++;
    if(failCount>=5){lockUntil=Date.now()+60000;failCount=0;showErr('🔒 Terlalu banyak percubaan gagal — terkunci 60 saat.')}
    else showErr(mapAuthErr(error,5-failCount));
    pinBuf='';renderDots();return;
  }
  failCount=0;
  const {data:prof}=await SB.from('profiles').select('*').eq('id',data.user.id).single();
  if(!prof||prof.active===false){await SB.auth.signOut();return showErr('Profil tidak aktif atau tidak dijumpai. Hubungi manager.');}
  if(portal==='staff'&&prof.role!=='staff'){await SB.auth.signOut();return showErr('Akaun ini perlu log masuk melalui Portal Manager.');}
  if(portal==='manager'&&prof.role==='staff'){await SB.auth.signOut();return showErr('Akaun ini perlu log masuk melalui Portal Staff.');}
  ME=mapProfile(prof);
  ROUTE=Object.assign(freshROUTE(),{view:prof.role==='staff'?'staff':'manager',portal:portal,pk:curPeriod()});
  await loadAll();
  await logAudit('login',ME.username+' log masuk ('+ME.role+')');
  pinBuf='';
  render();toast('Selamat datang, '+ME.name.split(' ')[0]+'! 👋','ok');
}

function slotPill(ds,shift,pub,locked){
  const ic=shift==='morning'?'☀':'🌙';let cls='free',mark='';
  if(locked){cls='none'}
  else if(pub){
    const es=DB.schedule.filter(e=>e.date===ds&&e.shift===shift);
    const mine=es.some(e=>e.staffId===ME.id);
    mark=(mine?'✔':'')+(es.length||'');
    cls=mine?'ok':(es.length?'taken':'none');
  }else{
    const mine=DB.bookings.find(b=>b.date===ds&&b.shift===shift&&b.staffId===ME.id);
    const n=slotCount(ds,shift);
    mark=(mine?(mine.status==='rejected'?'✕':'✔'):'')+(n||'');
    cls=mine?(mine.status==='approved'?'ok':mine.status==='pending'?'wait':'no'):(n?'taken':'free');
  }
  return '<button class="slot st-'+cls+'" onclick="openSlot(\''+ds+'\',\''+shift+'\')"><span>'+ic+'</span><b>'+(mark||'·')+'</b></button>';
}

  (pub?'':'<div class="notice warn">⚡ <b>TEMPOH INI TERBUKA untuk tempahan</b> — pilih syif anda sekarang supaya tidak terlepas! Boleh menempah hingga <b>'+dShort(winEnd)+'</b>.</div>')+
  '<div class="cal-grid glass">'+cells+'</div>'+

function bookingChip(st){return st==='approved'?'<span class="chip chip-ok">Disahkan</span>':st==='pending'?'<span class="chip chip-wait">Menunggu Kelulusan</span>':'<span class="chip chip-no">Tidak Dipilih</span>'}
function openSlot(ds,shift){
  const u=currentUser(),pk=periodOf(ds),pub=periodPublished(pk),past=ds<todayStr(),winEnd=bookingWindowEnd();
  const shName=shift==='morning'?'Syif Pagi · 10:00–16:00':'Syif Petang · 16:00–22:00';
  let body='<div class="detailrow"><span>Tarikh</span><b>'+fmtDateDS(ds)+'</b></div><div class="detailrow"><span>Syif</span><b>'+shName+'</b></div><div class="detailrow"><span>Tempoh</span><b>'+periodLabel(pk)+'</b></div>';
  if(pub){
    const es=DB.schedule.filter(e=>e.date===ds&&e.shift===shift),mine=es.find(e=>e.staffId===u.id);
    const sale=getSale(ds,shift);
    body+='<div class="detailrow"><span>Status jadual rasmi</span><b>'+(mine?'<span class="chip chip-ok">✔ Anda disahkan</span>':'Dikhaskan untuk '+es.length+' staff')+'</b></div>';
    if(past&&sale!=null){const rate=shiftRate(ds,shift,sale);
      body+='<div class="detailrow"><span>Jualan syif ini</span><b>'+rm(sale)+'</b></div><div class="detailrow"><span>Kadar gaji syif ini</span><b>'+rm2(rate)+'/jam'+(rate>DB.settings.baseRate?' ⚡':'')+'</b></div>';}
    if(mine&&!past)body+='<button class="btn btn-primary btn-big" onclick="closeModal();openSwapModal(\''+mine.id+'\')">🔄 Mohon Tukar Syif Ini</button>';
  }else if(ds<=todayStr()){
    body+='<div class="notice">Tarikh lampau atau hari ini — tempahan telah tertutup.</div>';
  }else if(ds>winEnd){
    body+='<div class="notice warn">🔒 Tempoh ini <b>belum dibuka</b> untuk tempahan. Tempahan dibenarkan untuk tempoh semasa &amp; tempoh seterusnya sahaja (hingga '+dShort(winEnd)+').</div>';
  }else{
    const n=slotCount(ds,shift);
    const mine=DB.bookings.find(b=>b.date===ds&&b.shift===shift&&b.staffId===u.id);
    body+='<div class="detailrow"><span>Tempahan slot ini (termasuk anda)</span><b>'+n+' daripada maks '+DB.settings.maxPerShift+'</b></div>';
    if(mine&&(mine.status==='pending'||mine.status==='approved')){
      body+='<div class="detailrow"><span>Tempahan anda</span><b>'+bookingChip(mine.status)+'</b></div>';
      if(mine.status==='pending')body+='<button class="btn btn-danger btn-big" onclick="cancelBooking(\''+mine.id+'\')">✕ Batalkan Tempahan Saya</button>';
    }else if(n>=DB.settings.maxPerShift){
      body+='<div class="notice warn">Slot ini telah penuh (had '+DB.settings.maxPerShift+' staff).</div>';
    }else{
      body+='<button class="btn btn-ok btn-big" onclick="bookSlot(\''+ds+'\',\''+shift+'\')">✔ Tempah Syif Ini</button>';
    }
  }
  openModal('Butiran Slot',body);
}
function renderStaffJadual(){
  const u=currentUser(),S=DB.settings;
  const mk=monthKey(todayStr()),mStart=mk+'-01',mEnd=mk+'-'+pad2(daysInMonth(mk));
  const key=e=>e.date+'|'+e.shift;
  /* Syif DISAHKAN sahaja: jadual rasmi + tugasan manager + tempahan diluluskan.
     Tempahan DITOLAK / tidak dipilih TIDAK dipaparkan. Bulan lampau tidak dipaparkan. */
  const items=DB.schedule.filter(e=>e.staffId===u.id&&e.date>=mStart);
  const seen=new Set(items.map(key));
  DB.bookings.forEach(b=>{if(b.staffId===u.id&&b.date>=mStart&&b.status==='approved'&&!seen.has(key(b)))items.push({date:b.date,shift:b.shift,hours:null,noShow:false})});
  items.sort((a,b)=>a.date.localeCompare(b.date)||(a.shift<b.shift?-1:1));
  const upcoming=items.filter(e=>e.date>=todayStr());
  const past=items.filter(e=>e.date<todayStr()&&e.date<=mEnd);
  const pending=DB.bookings.filter(b=>b.staffId===u.id&&b.date>=todayStr()&&b.status==='pending').sort((a,b)=>a.date.localeCompare(b.date));
  let html='<div class="pagehead"><h2>🗓️ My Schedule</h2><span class="chip chip-info">fokus: akan datang</span></div>';
  /* 1) PALING ATAS — syif akan datang yang telah disahkan manager */
  html+='<div class="card glass"><h3>📅 Syif Akan Datang <small>(telah disahkan)</small></h3>';
  if(upcoming.length){
    upcoming.forEach(e=>{
      const pub=periodPublished(periodOf(e.date));
      const days=Math.round((new Date(e.date+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
      const badge=days===0?'<span class="chip chip-warn">⚡ HARI INI</span>':days===1?'<span class="chip chip-wait">ESOK</span>':'';
      html+='<div class="brow"><div><b>'+fmtDateDS(e.date)+'</b><div class="chips" style="margin-top:4px">'+
      '<span class="chip chip-info">'+(e.shift==='morning'?'☀ Pagi 10:00–16:00':'🌙 Petang 16:00–22:00')+'</span>'+
      '<span class="chip">⏱ '+hrsOf(e)+' jam</span>'+
      (pub?'<span class="chip chip-ok">Jadual Rasmi</span>':'<span class="chip chip-ok">Disahkan</span>')+badge+'</div></div></div>';
    });
  }else html+='<p style="opacity:.75">Tiada syif disahkan pada masa hadapan — tempah di tab Kalendar 📅</p>';
  html+='</div>';
  /* 2) Menunggu kelulusan manager (pending sahaja) */
  if(pending.length){
    html+='<div class="card glass"><h3>⏳ Menunggu Kelulusan Manager ('+pending.length+')</h3>'+
    pending.map(b=>'<div class="brow"><div><b>'+fmtDateDS(b.date)+'</b> · '+(b.shift==='morning'?'☀ Pagi (10:00–16:00)':'🌙 Petang (16:00–22:00)')+'</div>'+bookingChip('pending')+'</div>').join('')+
    '<p class="hint">Manager akan mengesahkan &amp; mengeluarkan jadual rasmi. Tempahan yang tidak dipilih tidak akan dipaparkan di sini.</p></div>';
  }
  /* 3) Lampau bulan semasa — dilipat supaya senarai kekal pendek */
  if(past.length){
    html+='<details class="shiftdet card glass" style="padding:14px 18px"><summary>📜 Syif Lampau Bulan Ini ('+past.length+') — tekan untuk buka</summary>';
    past.forEach(e=>{
      const sale=getSale(e.date,e.shift),rate=sale!=null?shiftRate(e.date,e.shift,sale):null;
      html+='<div class="brow"><div><b>'+fmtDateDS(e.date)+'</b><div class="chips" style="margin-top:4px"><span class="chip chip-info">'+(e.shift==='morning'?'☀ Pagi 10:00–16:00':'🌙 Petang 16:00–22:00')+'</span><span class="chip">⏱ '+hrsOf(e)+' jam</span>'+
      (e.noShow?'<span class="chip chip-no">Tidak Hadir</span>':'')+
      (sale!=null?'<span class="chip'+(rate>S.baseRate?' chip-ok':'')+'">Jualan '+rm2(sale)+' · RM'+rate.toFixed(0)+'/jam</span>':'<span class="chip chip-wait">Jualan belum dimasukkan</span>')+'</div></div>'+
      (!e.noShow&&sale!=null?'<b class="amt">'+rm2(hrsOf(e)*rate)+'</b>':'')+'</div>';
    });
    html+='</details>';
  }
  if(!upcoming.length&&!pending.length&&!past.length)html+='<div class="card glass"><p style="opacity:.75">Belum ada jadual bulan ini. Mulakan dengan menempah syif di Kalendar 📅</p></div>';
  $('#viewRoot').innerHTML=html;
}

function setReportStaff(id){ROUTE.lrStaff=id;render()}
function lrNav(d){ROUTE.lrmk=shiftMonth(ROUTE.lrmk||monthKey(todayStr()),d);render()}
function reportRows(staffId,mk){
  return scheduledEntries(staffId,mk).slice().sort((a,b)=>a.date.localeCompare(b.date));
}
function reportSummary(staffId,mk){
  const rows=reportRows(staffId,mk);
  let ts=0,th=0,pn=0,ln=0;
  rows.forEach(e=>{
    const a=DB.attendance.find(x=>x.staffId===staffId&&x.date===e.date&&x.shift===e.shift);
    const sale=getSale(e.date,e.shift),h=hrsOf(e);
    if(!e.noShow){th+=h;if(sale!=null)ts+=sale}
    if(a&&a.punchIn)pn++;
    if(a&&a.late&&!a.lateOverride)ln++;
  });
  return {n:rows.length,h:Math.round(th*10)/10,ts:ts,pn:pn,ln:ln};
}

function staffOnShift(ds,sh){

  DB.schedule.forEach(e=>{if(e.date===ds&&e.shift===sh)ids.add(e.staffId)});
  DB.bookings.forEach(b=>{if(b.date===ds&&b.shift===sh&&b.status==='approved')ids.add(b.staffId)});

}
function myShiftsOn(ds){

  return [...s];
}

async function submitTask(id){
  const x=DB.tasks.find(t=>t.id===id);if(!x)return;
  const tp=tplOf(x.template);if(!tp)return;
  const items=tp.items.map((_,i)=>(($('#tk_'+i)||{}).checked));
  if(items.some(v=>!v))return toast('Tanda SEMUA langkah dahulu ✋','err');
  let bad=false;(tp.inputs||[]).forEach(f=>{const el=$('#tf_'+f.k);if(el&&!el.value.trim())bad=true});
  if(bad)return toast('Isi semua laporan yang dikehendaki','err');
  const data={items:items};
  (tp.inputs||[]).forEach(f=>{const el=$('#tf_'+f.k);if(el)data[f.k]=el.value.trim()});
  const {error}=await SB.rpc('submit_task',{p_id:id,p_data:data});
  if(error)return toast(friendly(error),'err');
  closeModal();await sync();render();toast('Tugasan dihantar kepada manager ✔','ok');
}

async function assignTaskSubmit(){
  const me=reqMgr();if(!me)return;
  const date=$('#atDate').value,shift=$('#atShift').value,tpl=$('#atTpl').value,note=($('#atNote')||{}).value||'';
  if(!date||!shift||!tpl)return toast('Lengkapkan tarikh, syif & tugasan','err');
  if(date<todayStr())return toast('Tarikh lampau tidak dibenarkan','err');
  const cnt=DB.tasks.filter(x=>x.date===date&&x.shift===shift).length;
  if(cnt>=2)return toast('Sudah '+cnt+' tugasan pada syif ini — maksimum 2','err');
  const n=staffOnShift(date,shift).length;
  if(!n&&!confirm('AMARAN: Tiada staf lagi dijadualkan pada syif ini.\n\nTugasan akan muncul apabila staf ditugaskan/ditempah. Teruskan?'))return;
  const {error}=await SB.rpc('assign_task',{p_date:date,p_shift:shift,p_template:tpl,p_note:note.trim()});
  if(error)return toast(friendly(error),'err');
  await sync();render();toast('Tugasan diberikan kepada staf syif tersebut ✔','ok');
}
async function ackTask(id){
  const me=reqMgr();if(!me)return;
  const x=DB.tasks.find(t=>t.id===id);
  if(!x||x.status!=='submitted')return toast('Tugasan ini belum dihantar oleh staf','err');
  const tp=tplOf(x.template);
  if(!confirm('Acknowledge (sahkan) tugasan "'+(tp?tp.t:x.template)+'" sebagai SELESAI?\n\nStaf akan dimaklumkan.'))return;
  const {error}=await SB.rpc('ack_task',{p_id:id});
  if(error)return toast(friendly(error),'err');
  await sync();render();toast('Tugasan diakui & ditanda selesai ✔','ok');
}
async function delTask(id){
  const me=reqMgr();if(!me)return;
  const x=DB.tasks.find(t=>t.id===id);if(!x)return;
  if(x.status!=='assigned')return toast('Hanya tugasan BELUM dihantar boleh dibuang','err');
  const tp=tplOf(x.template);
  if(!confirm('Buang tugasan "'+(tp?tp.t:x.template)+'" ('+dShort(x.date)+')?'))return;
  const {error}=await SB.from('tasks').delete().eq('id',id);
  if(error)return toast(friendly(error),'err');
  await logAudit('task_delete',(tp?tp.t:x.template)+' · '+dShort(x.date));
  await sync();render();toast('Tugasan dibuang','ok');
}

 /* ---------- 16d. LAPORAN KEWANGAN (Manager) ---------- */
function finNav(d){ROUTE.fmk=shiftMonth(ROUTE.fmk||monthKey(todayStr()),d);render()}
function stageOf(sale){ /* 3 stage sasaran jualan harian */
  if(sale==null)return {lb:'—',cls:'chip-no'};
  if(sale>=400)return {lb:'🔵 High',cls:'chip-info'};
  if(sale>=250)return {lb:'🟠 Middle',cls:'chip-wait'};
  if(sale>=150)return {lb:'🟢 Min',cls:'chip-ok'};
  return {lb:'🔴 Bawah min',cls:'chip-warn'};
}
function daySalesRows(mk){ /* jadual harian: pagi+petang+total, ikut stage */
  const dim=daysInMonth(mk),rows=[];
  for(let d=1;d<=dim;d++){
    const ds=mk+'-'+pad2(d);
    const m=getSale(ds,'morning'),e=getSale(ds,'evening');
    if(m==null&&e==null)continue;
    const tot=(m||0)+(e||0),sg=stageOf(tot);
    rows.push({ds:ds,m:m,e:e,tot:tot,sg:sg,sgm:stageOf(m),sge:stageOf(e)});
  }
  return rows;
}
function monthSalesTotal(mk){return daySalesRows(mk).reduce((a,r)=>a+r.tot,0)}
function periodPay(mk,ab){ /* jumlah gaji slip ikut tempoh (A=1–15, B=16–akhir) */
  const b=periodBounds(mk+(ab==='A'?'-A':'-B'));
  return DB.payslips.filter(p=>p.start>=b[0]&&p.start<=b[1]&&p.dateFake!==1).reduce((a,p)=>a+p.total,0);
}

async function addExpenseSubmit(){
  const me=reqMgr();if(!me)return;
  const date=$('#exDate').value,cat=$('#exCat').value,amt=parseFloat($('#exAmt').value),note=($('#exNote')||{}).value||'';
  if(!date||!cat)return toast('Lengkapkan tarikh & kategori','err');
  if(isNaN(amt)||amt<=0||amt>999999)return toast('Jumlah tidak sah','err');
  const {error}=await SB.rpc('add_expense',{p_date:date,p_category:cat,p_amount:amt,p_note:note.trim()});
  if(error)return toast(friendly(error),'err');
  await sync();render();toast('Perbelanjaan disimpan ✔','ok');
}
async function delExpense(id){
  const me=reqMgr();if(!me)return;
  const e=DB.expenses.find(x=>x.id===id);if(!e)return;
  if(!confirm('Padam perbelanjaan '+EXP_CATS[e.category][0]+' '+rm2(e.amount)+' ('+dShort(e.date)+')?'))return;
  const {error}=await SB.from('expenses').delete().eq('id',id);
  if(error)return toast(friendly(error),'err');
  await logAudit('expense_del',e.category+' · '+rm2(e.amount));
  await sync();render();toast('Rekod dipadam','ok');
}
async function setFixedCostSubmit(){
  const me=reqMgr();if(!me)return;
  const cat=$('#fcCat').value,label=$('#fcLabel').value.trim(),amt=parseFloat($('#fcAmt').value),day=parseInt($('#fcDay').value,10);
  if(!label)return toast('Nama wajib diisi','err');

  if(isNaN(day)||day<1||day>28)return toast('Hari mesti 1–28','err');

// Format no. telefon M'sia ke format antarabangsa (60XXXXXXXXX) untuk wa.me
function waPhone(p){
  if(!p||p==='—')return null;
  let s=String(p).replace(/[\s\-()]/g,'');
  if(s.startsWith('+60'))s=s.slice(1);
  else if(s.startsWith('60'))s=s;
  else if(s.startsWith('0'))s='6'+s;
  else if(s.startsWith('1'))s='60'+s;       // nombor mudahalih (12-345 6789)
  else s='60'+s;
  if(!/^60\d{8,12}$/.test(s))return null;
  return s;
}
// Bina link wa.me dengan mesej pra-isi
function waLink(phone,msg){
  const p=waPhone(phone);
  if(!p)return null;
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(msg);
}

function waTplChanged(){

// Bina mesej untuk staff tertentu berdasarkan templat dipilih
function waBuildMsg(staff){
  const tpl=WA_TEMPLATES.find(t=>t.id===$('#waTpl').value);
  if(!tpl)return '';
  let msg=tpl.tpl;
  msg=msg.replace(/\{name\}/g,staff.name);
  const custom=$('#waCustom')?$('#waCustom').value.trim():'';
  msg=msg.replace(/\{custom\}/g,custom);
  return msg;
}
// Update preview & senarai butang "Buka WhatsApp"
function waUpdatePreview(){
  const list=$('#waList');if(!list)return;
  const selected=[...list.querySelectorAll('.wa-row input[type=checkbox]:checked')].map(cb=>cb.closest('.wa-row').dataset.staff);
  const counter=$('#waCounter');
  if(counter)counter.textContent=selected.length+' dipilih';
  // Preview mesej (guna staff pertama yang dipilih)
  const preview=$('#waPreview');
  if(!selected.length){
    if(preview)preview.innerHTML='<b class="wa-label">Contoh mesej</b>Sila pilih staff di atas untuk lihat preview.';
  }else{
    const s=DB.users.find(u=>u.id===selected[0]);
    if(s&&preview){
      const msg=waBuildMsg(s);
      preview.innerHTML='<b class="wa-label">Preview untuk '+esc(s.name)+'</b>'+esc(msg);
    }
  }
  // Senarai butang "Buka WhatsApp"
  const sendList=$('#waSendList');if(!sendList)return;
  if(!selected.length){sendList.innerHTML='<p class="hint">Sila pilih staff di atas dahulu.</p>';return}
  sendList.innerHTML=selected.map(id=>{
    const s=DB.users.find(u=>u.id===id);if(!s)return '';
    const msg=waBuildMsg(s);
    const link=waLink(s.phone,msg);
    if(!link)return '<div class="wa-row nophone"><div class="info"><b>'+esc(s.name)+'</b><small>⚠ Tiada nombor sah</small></div></div>';
    return '<div class="wa-row sel"><div class="info"><b>'+esc(s.name)+'</b><small>📱 '+esc(s.phone)+'</small></div>'+
      '<a class="btn btn-sm btn-ok open-btn" href="'+link+'" target="_blank" rel="noopener" onclick="waLogSend(\''+id+'\')">📱 Buka WhatsApp</a></div>';
  }).join('');
}

// Handle upload gambar — resize ke 200x200, convert ke base64 JPEG
function handleAvatarUpload(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/'))return toast('Sila pilih fail gambar','err');
  if(file.size>5*1024*1024)return toast('Saiz gambar terlalu besar (maks 5MB)','err');
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const MAX=200;let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=h*MAX/w;w=MAX}}else{if(h>MAX){w=w*MAX/h;h=MAX}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const url=canvas.toDataURL('image/jpeg',0.75);
      window._avatarData=url;
      const w2=$('#avatarPreviewWrap');
      if(w2)w2.innerHTML='<img src="'+url+'" alt="avatar">';
      toast('Gambar dimuat naik ✔','ok');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearAvatar(){
  window._avatarData='';
  const me=currentUser();
  const w=$('#avatarPreviewWrap');

}

  const bankName=($('#epBankName')||{}).value||'';

    payload.p_active=!!$('#epActive').checked;
  }
  const btn=event&&event.target;if(btn)btn.disabled=true;
  const {error}=await SB.rpc(rpc,payload);
  if(btn)btn.disabled=false;
  if(error){
    const m=(error.message||'')+'';

  if(isSelf){ME.name=name.trim();ME.phone=phone.trim()||'—';ME.address=address.trim();ME.avatarUrl=avatar;ME.maritalStatus=marital;}

// Validate PIN + call RPC update_my_username + signOut
async function saveMyUsername(){
  const me=currentUser();if(!me)return;
  const cur=(($('#unCurPin')||{}).value||'').trim();
  const nv=(($('#unNew')||{}).value||'').trim().toLowerCase();
  if(!/^[0-9]{4,6}$/.test(cur))return toast('PIN semasa tidak sah','err');
  if(!/^[a-z0-9_.-]{2,20}$/.test(nv))return toast('Username baharu tidak sah (2-20 aksara: a-z, 0-9, . _ -)','err');
  if(nv===me.username)return toast('Username baharu sama dengan semasa','err');
  const btn=event&&event.target;if(btn)btn.disabled=true;
  const chk=await SB.auth.signInWithPassword({email:me.username+'@soobeh.app',password:cur+'-soobeh'});
  if(chk.error){if(btn)btn.disabled=false;return toast('PIN semasa salah','err');}
  const {error}=await SB.rpc('update_my_username',{p_new:nv});
  if(error){
    if(btn)btn.disabled=false;
    const m=(error.message||'')+'';
    if(/already used|sudah digunakan/i.test(m))return toast('Username sudah digunakan — pilih yang lain','err');
    return toast(friendly(error),'err');
  }
  closeModal();
  await logAudit('username_change_self',me.username+' → '+nv);
  toast('Username ditukar ✔ — log masuk semula dengan '+nv,'ok');
  setTimeout(async()=>{try{await SB.auth.signOut()}catch(e){};ME=null;DB=emptyDB();ROUTE=freshROUTE();render();},1500);
}

// Auto-generate receipt_no dan payment_no (format: GR-YYYYMM-001)
function nextConsignNo(prefix,existingArr,selectorFn){
  const ym=todayStr().slice(0,7).replace('-','');
  const pfx=prefix+'-'+ym+'-';
  const nums=existingArr.filter(selectorFn).map(x=>{
    const m=String(selectorFn(x)).match(/-(\d{3})$/);
    return m?+m[1]:0;
  });
  const next=(nums.length?Math.max(...nums):0)+1;
  return pfx+String(next).padStart(3,'0');
}

async function saveConsignProduct(consignorId,productId){
  const name=($('#cpName')||{}).value||'';

    name:name.trim(),
    code:code.trim(),
    unit_cost:cost,
    sell_price:sell
  };

function refreshConsignProducts(){
  const list=$('#crItemsList');if(!list)return;
  const consignorId=$('#crConsignor').value;
  const products=consignProductsOf(consignorId);
  if(!products.length){
    list.innerHTML='<div class="notice warn">⚠️ Syarikat ini belum ada produk. Tambah produk dahulu di tab Syarikat.</div>'+
      '<div class="chips"><button class="btn btn-sm" onclick="closeModal();setConsignSub(\'consignors\')">→ Tambah Produk</button></div>';
    return;
  }
  list.innerHTML=window._consignItems.map((it,idx)=>{
    return '<div class="consign-item-row" data-idx="'+idx+'">'+
      '<select id="crItem_'+idx+'" onchange="updateConsignItemTotal('+idx+')">'+
      products.map(p=>'<option value="'+p.id+'"'+(it.productId===p.id?' selected':'')+'>'+esc(p.name)+' — RM '+p.unitCost.toFixed(2)+'/unit</option>').join('')+
      '</select>'+
      '<input type="number" id="crQty_'+idx+'" min="1" step="1" placeholder="Kuantiti" value="'+(it.quantity||'')+'" oninput="updateConsignItemTotal('+idx+')">'+
      '<input type="number" id="crCost_'+idx+'" min="0" step="0.01" placeholder="Harga/Unit" value="'+(it.unitCost||products[0].unitCost)+'" oninput="updateConsignItemTotal('+idx+')">'+
      '<b id="crSub_'+idx+'" class="consign-subtotal">RM 0.00</b>'+
      (window._consignItems.length>1?'<button class="btn btn-sm btn-danger" onclick="removeConsignItemRow('+idx+')">✕</button>':'')+
      '</div>';
  }).join('');
  window._consignItems.forEach((_,i)=>updateConsignItemTotal(i));
}

function addConsignItemRow(){
  window._consignItems.push({});
  refreshConsignProducts();
}

function removeConsignItemRow(idx){
  window._consignItems.splice(idx,1);
  refreshConsignProducts();
}

function updateConsignItemTotal(idx){
  const prodId=$('#crItem_'+idx)&&$('#crItem_'+idx).value;
  const qty=parseFloat(($('#crQty_'+idx)||{}).value||'0')||0;
  const cost=parseFloat(($('#crCost_'+idx)||{}).value||'0')||0;
  if(prodId){
    const p=productOf(prodId);
    if(p&&!$('#crCost_'+idx).dataset.touched){
      $('#crCost_'+idx).value=p.unitCost.toFixed(2);
    }
  }
  const sub=qty*cost;
  const subEl=$('#crSub_'+idx);
  if(subEl)subEl.textContent='RM '+sub.toFixed(2);
  window._consignItems[idx]={productId:prodId,quantity:qty,unitCost:cost,totalCost:sub};
  const grand=window._consignItems.reduce((s,it)=>s+(it.totalCost||0),0);
  const gt=$('#crTotal');
  if(gt)gt.innerHTML='<span>💵 Jumlah Keseluruhan</span><b>RM '+grand.toFixed(2)+'</b>';
}

async function saveConsignReceipt(receiptNo){
  const consignorId=$('#crConsignor').value;
  const receivedDate=$('#crDate').value;
  const notes=($('#crNotes')||{}).value||'';
  if(!consignorId||!receivedDate)return toast('Sila pilih syarikat dan tarikh','err');
  const items=window._consignItems.filter(it=>it.productId&&it.quantity>0);
  if(!items.length)return toast('Sekurang-kurangnya 1 item diperlukan','err');
  const total=items.reduce((s,it)=>s+it.totalCost,0);
  const btn=event&&event.target;if(btn)btn.disabled=true;
  const {data:hdr,error:e1}=await SB.from('consign_receipts').insert({
    receipt_no:receiptNo,
    consignor_id:consignorId,
    received_date:receivedDate,
    total_cost:total,
    notes:notes,
    status:'received',
    received_by:ME.id
  }).select();
  if(e1){
    if(btn)btn.disabled=false;
    return toast(friendly(e1),'err');
  }
  const receiptId=hdr[0].id;
  const itemRows=items.map(it=>({
    receipt_id:receiptId,
    product_id:it.productId,
    quantity:it.quantity,
    unit_cost:it.unitCost,
    total_cost:it.totalCost
  }));
  const {error:e2}=await SB.from('consign_receipt_items').insert(itemRows);
  if(btn)btn.disabled=false;
  if(e2)return toast('Resit disimpan tapi item gagal: '+friendly(e2),'err');
  await logAudit('consign_receipts_ins',receiptNo+' — RM '+total.toFixed(2));
  closeModal();await sync();render();
  toast('Resit '+receiptNo+' disimpan ✔','ok');
}

async function saveConsignPayment(receiptId,paymentNo){
  const r=(DB.consignReceipts||[]).find(x=>x.id===receiptId);
  if(!r)return toast('Resit tidak dijumpai','err');
  if(r.status==='paid')return toast('Resit ini dah dibayar','err');
  const paymentDate=$('#cpDate').value;
  const method=$('#cpMethod').value;
  const acc=($('#cpAcc')||{}).value||'';
  const notes=($('#cpNotes')||{}).value||'';
  if(!paymentDate)return toast('Tarikh bayaran wajib','err');
  const payload={
    payment_no:paymentNo,
    receipt_id:receiptId,
    consignor_id:r.consignorId,
    payment_date:paymentDate,
    total_amount:window._consignPaymentTotal,
    payment_method:method,
    bank_account_paid:acc,
    notes:notes,
    line_items:window._consignPaymentItems,
    status:'paid',
    paid_by:ME.id
  };
  const btn=event&&event.target;if(btn)btn.disabled=true;
  const {error:e1}=await SB.from('consign_payments').insert(payload);
  if(e1){if(btn)btn.disabled=false;return toast(friendly(e1),'err');}
  const {error:e2}=await SB.from('consign_receipts').update({status:'paid'}).eq('id',receiptId);
  if(btn)btn.disabled=false;
  if(e2)return toast('Bayaran disimpan tapi status resit gagal dikemaskini: '+friendly(e2),'err');
  await logAudit('consign_payments_ins',paymentNo+' — '+r.receiptNo+' — RM '+window._consignPaymentTotal.toFixed(2));

// Simpan custom task baru/edited
async function saveCustomTask(id){
  const me=reqMgr();if(!me)return;
  const code=($('#ctCode')||{}).value||'';
  const icon=($('#ctIcon')||{}).value||'📋';
  const title=($('#ctTitle')||{}).value||'';
  const itemsText=($('#ctItems')||{}).value||'';
  if(!code.trim())return toast('Kod wajib diisi','err');
  if(!title.trim())return toast('Tajuk wajib diisi','err');
  if(title.trim().length<3)return toast('Tajuk terlalu pendek (mesti 3+ aksara)','err');
  // Parse items (satu per baris, abaikan baris kosong)
  const items=itemsText.split('\n').map(s=>s.trim()).filter(s=>s.length>0);
  if(items.length===0)return toast('Sekurang-kurangnya 1 item diperlukan','err');
  const payload={
    code:code.trim(),
    icon:icon.trim()||'📋',
    title:title.trim(),
    items:items
  };
  const btn=event&&event.target;if(btn)btn.disabled=true;
  let result;
  if(id){
    result=await SB.from('custom_tasks').update(payload).eq('id',id);
  }else{
    payload.created_by=ME.id;
    payload.active=true;
    payload.inputs=[];
    result=await SB.from('custom_tasks').insert(payload);
  }
  if(btn)btn.disabled=false;
  if(result.error)return toast(friendly(result.error),'err');
  await logAudit(id?'custom_task_upd':'custom_task_ins',code.trim()+' — '+title.trim());
  closeModal();await sync();render();
  toast('Tugasan custom disimpan ✔','ok');
}

async function saveAttendanceEdit(attId){
  const me=reqMgr();if(!me)return;
  const a=DB.attendance.find(x=>x.id===attId);
  if(!a)return toast('Rekod tidak dijumpai','err');
  const staff=DB.users.find(u=>u.id===a.staffId);
  if(!staff)return toast('Staf tidak dijumpai','err');
  const pinVal=($('#aePunchIn')||{}).value||'';
  const poutVal=($('#aePunchOut')||{}).value||'';
  const override=!!$('#aeOverride').checked;
  const reason=($('#aeReason')||{}).value||'';
  // Validate: kalau override=true, reason mesti ada
  if(override&&!reason.trim())return toast('Sebab override wajib diisi','err');
  // Validate: punch out mesti selepas punch in (kalau kedua-dua ada)
  if(pinVal&&poutVal){
    const pin=new Date(pinVal).getTime();
    const pout=new Date(poutVal).getTime();
    if(pout<pin)return toast('Punch Out mesti selepas Punch In','err');
  }
  // Build payload
  const payload={
    punch_in:pinVal?new Date(pinVal).toISOString():null,
    punch_out:poutVal?new Date(poutVal).toISOString():null,
    late_override:override,
    override_reason:reason.trim(),
    override_by:me.id,
    override_at:new Date().toISOString()
  };
  const btn=event&&event.target;if(btn)btn.disabled=true;
  // Use RPC function (security definer) - direct UPDATE blocked by RLS
  const {error}=await SB.rpc('manager_update_attendance',{p_att_id:attId,p_punch_in:payload.punch_in,p_punch_out:payload.punch_out,p_late_override:payload.late_override,p_override_reason:payload.override_reason});
  if(btn)btn.disabled=false;
  if(error)return toast(friendly(error),'err');
  // Audit log
  const action=override?'attendance_override_approve':'attendance_edit';
  const detail=staff.username+' · '+dShort(a.date)+' '+(a.shift==='morning'?'Pagi':'Petang')+
    (override?(' · Luluskan lewat: '+reason.trim()):' · Edit punch in/out');
  await logAudit(action,detail);
  closeModal();await sync();render();
  toast('Attendance dikemaskini ✔','ok');
}
